# Self-hosted Procaptcha provider.
#
# Generate the .env this reads with:
#   pnpm exec tsx ./dev/scripts/src/scripts/generateSelfHostedEnv.ts --host captcha.example.com
#
# Then, from the repository root (where the .env is):
#   docker compose up -d
#
# The .env sets COMPOSE_FILE to this file, so plain docker compose commands
# find it without -f.
#
# Full guide: https://docs.prosopo.io/en/self-hosting/
#
# Unrelated to docker-compose.provider.yml, which is Prosopo's own production
# stack and carries fleet-specific wiring (two provider versions, a DNS
# sidecar, an eBPF TCP probe, per-host certificates) that a self-hosted node
# neither has nor needs.

services:
  mongo:
    image: mongo:6.0.28
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${PROSOPO_DATABASE_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${PROSOPO_DATABASE_PASSWORD}
    volumes:
      - mongo_data:/data/db
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '1'

  redis:
    # Must be redis-stack, not plain Redis: the provider stores access rules in
    # a RediSearch index, which stock Redis does not ship.
    image: redis/redis-stack-server:latest
    restart: unless-stopped
    environment:
      REDIS_ARGS: --requirepass ${REDIS_CONNECTION_PASSWORD}
    volumes:
      - redis_data:/data
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '1'

  provider:
    image: prosopo/provider:${PROSOPO_PROVIDER_IMAGE_VERSION:?set it in .env, or regenerate .env with generateSelfHostedEnv.ts}
    restart: unless-stopped
    depends_on:
      - mongo
      - redis
    env_file: .env
    environment:
      # Where detector_pool_set writes a pool and the provider loads it from.
      # Fixed here because it must match the volume below.
      PROSOPO_DETECTOR_POOL_DIR: /usr/src/app/data/detector-pool
      # Lets this node load detectors built outside Prosopo, such as
      # demos/detector-botd. Without a pool it does nothing.
      PROSOPO_DETECTOR_OPEN_FORMAT: '1'
    volumes:
      - detector_pool:/usr/src/app/data/detector-pool
    ports:
      # Loopback only. Public traffic arrives through Caddy on 443; this is
      # here so you can curl the provider directly while setting up, and can
      # be removed once you are happy.
      - '127.0.0.1:9229:9229'
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '1'
    healthcheck:
      # The provider image is distroless: no curl, no shell. node is the only
      # binary in it, so the check runs in node.
      test:
        - CMD
        - /nodejs/bin/node
        - -e
        - fetch('http://localhost:9229/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 5m
      retries: 3
      start_period: 30s
      timeout: 10s

  caddy:
    # prosopo/caddy rather than upstream caddy: provider.Caddyfile uses four
    # plugins compiled into this image (caddy-l4, chaddy, caddy-ratelimit,
    # caddy-requestid) and will not start without them.
    image: prosopo/caddy:${CADDY_IMAGE_VERSION:-2.5.9}
    restart: unless-stopped
    depends_on:
      - provider
    env_file: .env
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./docker/provider.Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '1'

volumes:
  detector_pool:
  mongo_data:
  redis_data:
  caddy_data:
  caddy_config:

services:
    provider:
        image: prosopo/fluxprovider:${PROVIDER_IMAGE_VERSION}
        build:
            context: ..
            dockerfile: ./docker/images/provider/flux-provider.dockerfile
        env_file:
            - ../.env.rococo
        ports:
            - '9229:9229'
        tty: true
        networks:
            - internal
            - external
        # Cap the json log file so a chatty container can't fill the host disk.
        logging:
            driver: 'json-file'
            options:
                max-size: '100m'
                max-file: '1'
networks:
    internal:
        name: internal
        internal: true
    external:
        name: external

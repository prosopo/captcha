services:
    caddy:
        container_name: caddy
        image: prosopo/caddy:latest
        env_file:
            - ../.env.${NODE_ENV}
        restart: unless-stopped # unless the container has been stopped, it will be restarted, even on reboot
        ports:
            - '80:80'
            - '443:443'
        volumes:
            - ./oo2.Caddyfile:/etc/caddy/Caddyfile
            - caddy_data:/data
            - caddy_config:/config
        networks:
            external:
            internal:
        logging:
            driver: 'json-file'
            options:
                max-size: '100m'
                max-file: '1'
        healthcheck:
            # the image has no curl; the admin api listens on 2020 (see the Caddyfile)
            test: [ "CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2020/metrics" ]
            interval: 5m
            retries: 3
            start_period: 30s
            timeout: 10s
    oo:
        container_name: oo
        image: public.ecr.aws/zinclabs/openobserve:latest
        env_file:
            - ../.env.${NODE_ENV}
        environment:
            # Dashboard panels query with no row limit, so OpenObserve caps them at this and
            # silently drops time ranges past it (default 1000). Kept finite because it is also
            # the only cap on raw-row queries with no LIMIT.
            ZO_QUERY_DEFAULT_LIMIT: 20000
        restart: unless-stopped # unless the container has been stopped, it will be restarted, even on reboot
        volumes:
            - ./oo_data:/data
        networks:
            - internal
            - external
        logging:
            driver: 'json-file'
            options:
                max-size: '100m'
                max-file: '1'
        dns:
            - 8.8.8.8
            - 1.1.1.1
            - 208.67.222.222
        healthcheck:
            # the image has no shell or curl; this cli command queries the running server's /node/status
            test: [ "CMD", "/openobserve", "node", "status" ]
            interval: 1m
            timeout: 10s
            retries: 3
            start_period: 30s

networks:
    internal:
        name: internal
        internal: true
        driver: bridge
        ipam:
            config:
                - subnet: 172.18.0.0/16
                  gateway: 172.18.0.1
    external:
        name: external
        driver: bridge
        ipam:
            config:
                - subnet: 172.19.0.0/16
                  gateway: 172.19.0.1
volumes:
    caddy_data:
    caddy_config:

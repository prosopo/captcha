# Base provider stack. Always layer an env overlay on top, plus any optional ones:
#   docker compose -f docker-compose.provider.yml -f docker-compose.provider.<production|staging|development>.yml up -d
#   ... -f docker-compose.provider.tcp-probe.yml   # optional eBPF sidecar
# Later files override earlier ones. Relative paths in every overlay resolve
# against this directory, so keep the overlays beside this file.
services:
  provider1:
    container_name: provider1
    image: prosopo/provider:${COMPOSE_PROVIDER_IMAGE_VERSION}
    labels:
      - "vector.provider=true" # enable logging as a provider
      - "vector.docker=true" # log docker events
    restart: unless-stopped # unless the container has been stopped, it will be restarted, even on reboot
    pull_policy: always
    env_file:
      - ../.env.1.${NODE_ENV}
    # Pins mongo1 to its tailnet address so both the seed host in
    # PROSOPO_MONGO_*_URI and the name mongod advertises for itself
    # (`mongo1.prosopo.io:27018`, because it runs --replSet) resolve inside the
    # WireGuard tunnel. Overriding only the URI does not work: the driver
    # discovers the replica set and re-dials the advertised name, which without
    # this goes back out to the public load balancer. The URIs therefore carry
    # ssl=false — mongod itself has TLS off, and WireGuard supplies the
    # encryption, terminating on mongo1 rather than on a proxy.
    #
    # Literal, not a compose variable: 18 playbooks run `docker compose` against
    # this file with their own environment blocks, and an unset variable here
    # expands to "mongo1.prosopo.io:" and stops the container from starting.
    # Inert where mongo1 is not used — staging points at a different host.
    extra_hosts:
      - "mongo1.prosopo.io:100.64.0.21"
    volumes:
      # Detector bundle pool, host-mounted so a pushed pool survives container
      # restarts. Never bake this into the image: prosopo/provider is a public
      # Docker Hub image and every bundle ships with its own RSA private key.
      # provider1 and provider2 run different image versions, so they each get
      # their own pool — bundles stamped with another release are skipped at
      # load (PROSOPO_DETECTOR_POOL_RELEASE).
      - ./data/detector-pool.1:/app/data/detector-pool
    ports:
      - '127.0.0.1:9229:9229'
    networks:
      external:
      internal:
        ipv4_address: 172.18.0.3
        ipv6_address: fd00:aaaa::3
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '1'
    healthcheck:
      # Distroless runtime: no curl. node is the only binary in the image.
      test: [ "CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:9229/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 5m
      retries: 3
      start_period: 30s
      timeout: 10s
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 208.67.222.222
  provider2:
    container_name: provider2
    image: prosopo/provider:${COMPOSE_PROVIDER_PREVIOUS_IMAGE_VERSION}
    labels:
      - "vector.provider=true" # enable logging as a provider
      - "vector.docker=true" # log docker events
    restart: unless-stopped # unless the container has been stopped, it will be restarted, even on reboot
    pull_policy: build
    env_file:
      - ../.env.2.${NODE_ENV}
    # See provider1.
    extra_hosts:
      - "mongo1.prosopo.io:100.64.0.21"
    volumes:
      # See provider1 — separate pool because this container runs the previous
      # image version.
      - ./data/detector-pool.2:/app/data/detector-pool
    ports:
      - '127.0.0.1:9339:9339'
    networks:
      external:
      internal:
        ipv4_address: 172.18.0.7
        ipv6_address: fd00:aaaa::7
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '1'
    healthcheck:
      # Distroless runtime: no curl. node is the only binary in the image.
      test: [ "CMD", "/nodejs/bin/node", "-e", "fetch('http://localhost:9339/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))" ]
      interval: 5m
      retries: 3
      start_period: 30s
      timeout: 10s
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 208.67.222.222
  database:
    container_name: database
    image: mongo:6.0.28
    command: mongod --wiredTigerCacheSizeGB 2.0
    deploy:
      resources:
        limits:
          # Total container ceiling (Cache + overhead)
          memory: 3G
    labels:
      - "vector.mongo=true" # enable logging as a provider
      - "vector.docker=true" # log docker events
    restart: unless-stopped # unless the container has been stopped, it will be restarted, even on reboot
    volumes:
      - /data/db:/data/db
    ports:
      - '127.0.0.1:27017:27017'
    env_file:
      - ../.env.1.${NODE_ENV}
    networks:
      external:
      internal:
        ipv4_address: 172.18.0.5
        ipv6_address: fd00:aaaa::5
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '1'
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')", "--quiet" ] # ping the mongo server (mongo:6 ships mongosh, the legacy mongo shell was removed in 6.0)
      interval: 5m
      retries: 3
      start_period: 30s
      timeout: 10s
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 208.67.222.222
  caddy:
    container_name: caddy
    image: prosopo/caddy:${CADDY_IMAGE}
    env_file:
      - ../.env.1.${NODE_ENV}
    labels:
      - "vector.caddy=true" # enable logging as caddy
      - "vector.docker=true" # log docker events
    restart: unless-stopped # unless the container has been stopped, it will be restarted, even on reboot
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
      - "[::]:80:80"
      - "[::]:443:443"
    volumes:
      - ./provider.Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
      # Shared with the tcp-probe sidecar (docker-compose.provider.tcp-probe.yml). Chaddy's
      # `tcp_probe_socket` directive dials the sidecar's Unix socket
      # here to look up raw TCP handshake signals for the current
      # request and forward them as `X-TLS-*` headers. If the socket
      # isn't there (sidecar not enabled) chaddy debug-logs and drops
      # the extra headers per-request — Caddy startup is unaffected.
      # `ro`: only the sidecar creates / writes the socket.
      - /var/run/tcp-probe:/var/run/tcp-probe:ro
      # PEM for the load-balanced pronode.prosopo.io hostname. The cert
      # getter (pronode4) obtains it via certbot DNS-01 against Bunny,
      # then provider.yml's distribute step rsyncs it to every pronode
      # under ./certs/pronode-global/. The site block in
      # provider.cert-getter.Caddyfile references the path inside the
      # container. KEEP THIS MOUNT — removing it breaks TLS for the
      # global hostname on the next `up --force-recreate` even though
      # an already-running container keeps the old mount alive.
      - ./certs/pronode-global:/certs/pronode-global:ro
    networks:
      external:
      internal:
        ipv4_address: 172.18.0.6
        ipv6_address: fd00:aaaa::6
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '1'
    healthcheck:
      test: [ "CMD", "curl", "--fail", "localhost:2020/metrics" ] # ping the caddy admin api (provider.Caddyfile moves admin to :2020 to avoid conflicting with the caddy daemon)
      interval: 5m
      retries: 3
      start_period: 30s
      timeout: 10s
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 208.67.222.222
  redis-stack:
    container_name: redis-stack
    # unlike "redis/redis-stack-server" this image includes Insights
    image: redis/redis-stack:${REDIS_IMAGE}
    restart: unless-stopped
    env_file:
      - ../.env.1.${NODE_ENV}
    volumes:
      - ./data:/data # mount a volume for data persistence
      - ./redis.conf:/redis-stack.conf
    ports:
      - '127.0.0.1:6379:6379' # DB
    networks:
      internal:
        ipv4_address: 172.18.0.8
        ipv6_address: fd00:aaaa::8
    # Cap the json log file so a chatty container can't fill the host disk.
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '1'
  # Scraped by vector's redis_metrics source. The exporter only reads
  # REDIS_PASSWORD, so the env file carries it as a copy of
  # REDIS_CONNECTION_PASSWORD; without it the exporter connects but every
  # scrape returns redis_up 0.
  redis-exporter:
    container_name: redis-exporter
    image: oliver006/redis_exporter:v1.62.0
    env_file:
      - ../.env.1.${NODE_ENV}
    environment:
      REDIS_ADDR: redis://redis-stack:6379
    labels:
      - "vector.docker=true" # log docker events
    depends_on:
      - redis-stack
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 64M
          cpus: '0.25'
    expose:
      - "9121"
    networks:
      internal:
        ipv4_address: 172.18.0.11
        ipv6_address: fd00:aaaa::b
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '1'
  # Scraped every 60s by vector's cadvisor_metrics source: per-container cpu,
  # memory, disk and network, plus the whole machine as id="/". The root
  # container is the only source of host-wide network and tcp figures, since
  # vector's host_metrics sees only its own network namespace. Per-process
  # and per-cpu metrics are left off to keep the series count down.
  cadvisor:
    container_name: cadvisor
    image: gcr.io/cadvisor/cadvisor:v0.52.1
    privileged: true # reads cgroup and device stats for every container
    devices:
      - /dev/kmsg
    command:
      - '--enable_metrics=cpu,memory,network,diskIO,disk,oom_event,tcp'
      - '--housekeeping_interval=30s'
      - '--store_container_labels=false'
      - '--whitelisted_container_labels=com.docker.compose.service,com.docker.compose.project'
      - '--docker_only=true'
    labels:
      - "vector.docker=true" # log docker events
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    expose:
      - "8080"
    networks:
      internal:
        ipv4_address: 172.18.0.12
        ipv6_address: fd00:aaaa::c
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '1'
  vector:
    container_name: vector
    image: prosopo/vector:${VECTOR_IMAGE}
    env_file:
      - ../.env.1.${NODE_ENV}
    environment:
      # host_metrics reads these instead of the container's own /proc and /sys
      PROCFS_ROOT: /host/proc
      SYSFS_ROOT: /host/sys
      # Measured at 0-17% of one core; two worker threads is plenty and keeps
      # it from spawning one per core on the big hosts.
      VECTOR_THREADS: 2
    labels:
      - "vector.docker=true" # log docker events
    restart: unless-stopped # unless the container has been stopped, it will be restarted, even on reboot
    deploy:
      resources:
        limits:
          # Measured RSS is 120-250MB. The cap stops a backlog or a leak from
          # starving the provider; vector restarts and its disk buffers survive.
          memory: 512M
          cpus: '1.0'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock # needed for monitoring docker container events, e.g. start/stop/etc
      # Read-only bind mounts need no extra privileges.
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      # Disk buffers for the high-value log sinks. Without a volume they live
      # in the container layer and are lost whenever vector is recreated.
      - vector_data:/var/lib/vector
    networks:
      external:
      internal:
        ipv4_address: 172.18.0.9
        ipv6_address: fd00:aaaa::9
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '1'
    healthcheck:
      test: [ "CMD", "curl", "--fail", "localhost:8686/health" ]
      interval: 30s
      timeout: 10s
      retries: 1
      start_period: 10s
    dns:
      - 8.8.8.8
      - 1.1.1.1
      - 208.67.222.222
  # Our own IP reputation DB (captcha-private#5467), replacing the ipapi.is
  # worker outright. It keeps the service name, the port and an `ipinfo`
  # network alias, so every caller that resolves ipinfo:3899 keeps working
  # untouched and the rollback is reverting this block. The response carries
  # the ipapi.is field shape, so callers parsing asn/geo/booleans need no
  # change.
  #
  # Memory: the artifact is ~1.8 GB held in RAM against the ipapi.is worker's
  # 7.4-8.4 GB. The cap is well above the measured figure and well below the
  # old 10G, so an overshoot kills this container rather than letting the
  # kernel pick mongod or a provider as the victim.
  ipinfo:
    container_name: ipinfo
    image: ghcr.io/prosopo/reputation:${REPUTATION_VERSION:-0.3.1}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 3G
    environment:
      REPUTATION_ARTIFACT: /data/reputation.bin
      REPUTATION_WEIGHTS: /data/weights.json
      REPUTATION_BIND: 0.0.0.0:3899
    expose:
      - "3899"
    networks:
      internal:
        aliases:
          - ipinfo
          - reputation
    volumes:
      - ./reputation:/data:ro
    healthcheck:
      test: ["CMD", "/usr/local/bin/reputation", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '1'
  dns:
    # DNS observation sidecar. Caddy fronts TLS for *.t.{CADDY_DOMAIN}
    # and reverse-proxies HTTP to this container — see provider.Caddyfile.
    container_name: dns
    image: prosopo/dns:${DNS_VERSION?DNS_VERSION must be set}
    cap_add:
      - NET_BIND_SERVICE
    env_file:
      - ../.env.1.${NODE_ENV}
    ports:
      # Bind on the host's external IPv4 specifically — systemd-resolved
      # already claims 0.0.0.0:53 indirectly via stub-resolver iptables.
      # ${HOST_IPV4} is exported by the ansible playbook.
      - "${HOST_IPV4}:53:53/udp"
      - "${HOST_IPV4}:53:53/tcp"
      # No host port for the HTTPS pixel: Caddy's layer4 block on :443
      # SNI-routes `*.t.{CADDY_DOMAIN}` straight to dns:443 over the
      # docker network. URLs no longer carry a :9362 suffix.
    environment:
      - DNS_HTTPS_PORT=443
      - DNS_HTTPS_BIND=0.0.0.0
      # Caddy `layer4` raw-proxies *.t.{CADDY_DOMAIN} to dns:443 with a
      # PROXY v2 header so the sidecar sees the real client peer instead
      # of Caddy's docker bridge address. Must be paired with
      # `proxy_protocol v2` on the @dns_subzone route in provider.Caddyfile.
      - DNS_PROXY_PROTOCOL=1
      # Dual-stack: serve AAAA pointing at the host's public ipv6
      # alongside the existing A record. Without this, v6-preferring
      # browsers happy-eyeballs back to v4 for the pixel and
      # `dnsEvent.peerIp` records the v4 exit instead of the real v6.
      # Unset on v4-only hosts — the sidecar (≥0.1.7) treats blank as
      # "no AAAA" and serves A only.
      - DNS_AAAA_RECORD=${HOST_IPV6:-}
      # Tight shipper batch flush. Default 1000ms adds ~500ms average
      # buffering latency to every dnsEvent on the way to provider1's
      # admin endpoint. Empty batches are skipped (see shipper.rs), so
      # the cost on idle hosts is just a tokio tick wakeup. Real POST
      # volume is bounded by the event rate, not the flush rate.
      - DNS_SHIPPER_FLUSH_MS=50
    volumes:
      - /data/dns:/data
      # dns-tenants.json is rendered per host by ansible
      # (playbooks/provider.yml) before `compose up`. Pronodes come and
      # go independently; a single repo-checked-in file would make every
      # host re-deploy on every tenant change. The file is .gitignored.
      - ./dns-tenants.json:/etc/dns/tenants.json:ro
    networks:
      external:
      internal:
        ipv4_address: 172.18.0.10
        ipv6_address: fd00:aaaa::a
    restart: unless-stopped
    # Cap the json log file so a chatty container can't fill the host disk.
    logging:
      driver: 'json-file'
      options:
        max-size: '100m'
        max-file: '1'
networks:
  internal:
    enable_ipv6: true
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.18.0.0/16
          gateway: 172.18.0.1
        - subnet: fd00:aaaa::/64
          gateway: fd00:aaaa::1

  external:
    enable_ipv6: true
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.19.0.0/16
          gateway: 172.19.0.1
        - subnet: fd00:bbbb::/64
          gateway: fd00:bbbb::1
volumes:
  caddy_data:
  caddy_config:
  vector_data:

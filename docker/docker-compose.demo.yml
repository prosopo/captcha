# https://docs.docker.com/cloud/ecs-integration/
services:
    database:
        image: mongo:6.0.28
        ports:
            - '27017:27017'
        environment:
            - MONGO_INITDB_ROOT_USERNAME=root
            - MONGO_INITDB_ROOT_PASSWORD=$MONGO_INITDB_ROOT_PASSWORD
            - MONGO_INITDB_DATABASE=prosopo
        # Cap the json log file so a chatty container can't fill the host disk.
        logging:
            driver: 'json-file'
            options:
                max-size: '100m'
                max-file: '1'
    provider:
        # TODO update provider image
        image: prosopo/provider:v1.0.5
        environment:
            - NODE_ENV=production
            - PROSOPO_SITE_KEY=5GoHpdidCX62uE3wuQagVWhf4Un1gVten4NZ6k72Hd74WYYr
            - PROSOPO_DATABASE_PASSWORD=$MONGO_INITDB_ROOT_PASSWORD
        ports:
            - '3000:3000'
        depends_on:
            - database
        # Cap the json log file so a chatty container can't fill the host disk.
        logging:
            driver: 'json-file'
            options:
                max-size: '100m'
                max-file: '1'


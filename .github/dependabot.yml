# Dependabot configuration.
# Note: each npm/github-actions PR opened here also triggers `dependabot-changeset.yml`,
# which refreshes the lockfile and writes a changeset so the `changesets` check passes.
# That workflow needs PROSOPONATOR_PAT added under Settings > Secrets and variables >
# Dependabot (Actions secrets are NOT available to Dependabot-triggered runs).
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    # Matches pnpm's minimumReleaseAge, which refuses versions younger than this.
    cooldown:
      default-days: 7
    # @prosopo/locale tests its i18next middleware through express, and
    # i18next-http-middleware@3.9.9 types its handler against express 4. On
    # express 5 that handler no longer matches `app.use`, so locale stops
    # compiling. The break is invisible to this repo's own CI and only shows up
    # where locale is consumed, so hold express at 4 until the middleware ships
    # express 5 typings, then lift both together.
    ignore:
      - dependency-name: "express"
        versions: [">=5"]
      - dependency-name: "@types/express"
        versions: [">=5"]
    # Keep majors as standalone PRs (they may need manual review / a larger bump),
    # group everything else to cut down on PR + changeset noise across the workspace.
    groups:
      npm-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"

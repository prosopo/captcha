# Run tests for js packages

name: tests

on:
  pull_request:
    branches: [main, dev, staging, release/*]
    # Ignore-based, never inclusion-based: an allowlist silently stops testing
    # any newly added directory, whereas anything unrecognised here still runs
    # CI. Only paths that cannot possibly affect this workflow belong below.
    #
    # Safe against the "required check never reports" trap: the one required
    # context on main is `check`, and required-check.yml publishes it with no
    # path filter at all, so a PR touching only ignored paths still gets a
    # `check` and does not sit pending forever.
    #
    # That role used to be filled by changesets.yml, which published a job also
    # *named* `check` -- which is precisely why the required context resolved
    # from whichever of seven same-named jobs reported first, and why this
    # paragraph used to describe the defect as the safeguard.
    paths-ignore:
      - '.changeset/**' # release metadata; nothing here reads it
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE*'
      - 'docs/**'
      - '**.md'
    types:
      - opened # when a PR is opened
      - synchronize # when a PR is pushed to
      - reopened # when a PR is reopened
      - ready_for_review # when a PR is marked as ready for review (e.g. taken off draft mode)
      - converted_to_draft
  workflow_dispatch:
    inputs:
      runner:
        description: "Where the jobs run: auto (GH_RUNNER_MAP, else hosted), hosted or self-hosted. Fork PRs are always hosted."
        type: choice
        options: [auto, hosted, self-hosted]
        default: auto

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
  GH_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NODE_OPTIONS: "--max-old-space-size=4096"
  NODE_TLS_REJECT_UNAUTHORIZED: "0"
  NODE_ENV: "test"

defaults:
  run:
    shell: bash

# Fork guard on every job: a PR from a fork never runs here. Jobs hold
# secrets and write shared caches that later trusted jobs restore, so fork
# code must not run in them (https://github.com/prosopo/gh-runner).
jobs:
  runner:
    # Hosted vs self-hosted for the jobs below (precedence in pick-runner.yml).
    # Public repo, so keep it out of GH_RUNNER_MAP: fork PRs are hosted regardless,
    # and standard hosted runners are free and unlimited on public repos, so the
    # fleet buys nothing. Only *larger* runners are billed; do not add size labels.
    # https://docs.github.com/en/billing/reference/actions-runner-pricing
    # workflow-lint: allow pr-types -- not skipped on drafts or forks: every job below reads runs-on from it
    uses: prosopo/github_actions/.github/workflows/pick-runner.yml@aa71b53c10f350e217c92ebe31beed8bd114a587  # main
    permissions:
      contents: read
      pull-requests: read
    with:
      actions-ref: aa71b53c10f350e217c92ebe31beed8bd114a587
      workflow: tests
      runner: ${{ inputs.runner || 'auto' }}

  check:
    name: tests
    timeout-minutes: 60
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.default) }}
    if: ${{ (github.event.pull_request.draft != true) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Print contexts
        timeout-minutes: 5
        uses: prosopo/github_actions/.github/actions/print_contexts@0f332e76cb54093f6130fa9bdee5b54a9f870de9  # main
        with:
          INPUTS_CONTEXT: ${{ toJson(inputs) }}
          NEEDS_CONTEXT: ${{ toJson(needs) }}
          VARS_CONTEXT: ${{ toJson(vars) }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          token: ${{ secrets.PROSOPONATOR_PAT }}
          submodules: "recursive"

      - name: Setup node and pnpm
        timeout-minutes: 30
        uses: prosopo/github_actions/.github/actions/setup-pnpm@0f332e76cb54093f6130fa9bdee5b54a9f870de9  # main
        with:
          node-version: '24.22.1'
          node-cache: 'pnpm'
          store-path: ''

      - name: env
        timeout-minutes: 30
        run: |
          # The bundle is built in production mode even here.
          node .github/scripts/setup-env-files.mjs --mode production --only packages/procaptcha-bundle

      # build all packages in workspace
      - run: timeout 29m pnpm exec turbo run build
        timeout-minutes: 30
      - run: timeout 29m pnpm exec turbo run build:cjs
        timeout-minutes: 30

      # bundle procaptcha-bundle using webpack
      - name: Webpack Bundle procaptcha-bundle
        timeout-minutes: 30
        run: |
          NODE_ENV="development" timeout 29m pnpm exec turbo run @prosopo/procaptcha-bundle#bundle:webpack

      - name: Start the docker images
        timeout-minutes: 30
        run: |
          timeout 29m docker compose --file ./docker/docker-compose.test.yml up -d --remove-orphans --force-recreate --always-recreate-deps
          timeout 5m docker container ls
          sleep 10s

      # setup certs
      - name: Setup certs
        timeout-minutes: 5
        run: |
          ./setup_certs.sh
          ./install_cert.sh
          echo "NODE_EXTRA_CA_CERTS=$(pwd)/certs/server.crt" >> "$GITHUB_ENV"

      - name: Setup env
        timeout-minutes: 5
        run: |
          set -euxo pipefail # stop on errors, print commands, fail on pipe fails

          node .github/scripts/setup-env-files.mjs --https

          NODE_ENV="test" timeout 4m pnpm run setup

          echo NODE_ENV: "$NODE_ENV"

      - name: Start services and run tests
        timeout-minutes: 45
        env:
          SKIP_REDIS: "true"
          # Committed test detector-pool fixture (throwaway keys). A non-empty
          # pool makes the provider run scored detection instead of the
          # empty-pool PoW fallback, so frictionless integration tests exercise
          # the real decrypt path.
          PROSOPO_DETECTOR_POOL_DIR: ${{ github.workspace }}/packages/provider/fixtures/detector-pool
        run: |
          timeout 44m pnpm exec concurrently \
            "NODE_ENV=test pnpm run start:provider" \
            "sleep 10s && NODE_TLS_REJECT_UNAUTHORIZED=0 NODE_ENV=test pnpm run test:all" \
            --success "first" --kill-others

      - run: timeout 4m docker compose --file ./docker/docker-compose.test.yml down
        timeout-minutes: 5

  # The widget decides its own width through CSS intrinsic sizing, container
  # queries and flex wrapping, none of which jsdom implements -- so the suite
  # that asserts what the widget actually measures needs a real engine, and
  # `pnpm run test:all` cannot run it. Embedding pages size the widget in every
  # way CSS allows, and the ones that size it by *measuring* it have broken
  # repeatedly and silently: the widget renders, just at its minimum width.
  #
  # Kept out of `check` so its failure is reported on its own, and because it
  # needs none of what that job builds -- no docker, no provider, no workspace build,
  # since the package imports nothing from the workspace at runtime. It still
  # gates the merge: required-check.yml waits on every check run on the commit,
  # so there is no list to add this to.
  widget-layout:
    name: widget layout
    timeout-minutes: 60
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.default) }}
    if: ${{ (github.event.pull_request.draft != true) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          submodules: false

      - name: Setup node and pnpm
        timeout-minutes: 30
        uses: prosopo/github_actions/.github/actions/setup-pnpm@0f332e76cb54093f6130fa9bdee5b54a9f870de9  # main
        with:
          node-version: '24.22.1'
          node-cache: 'pnpm'
          store-path: ''
          install-args: '--prefer-offline --filter @prosopo/widget-skeleton'

      - name: Install the browser vitest drives
        timeout-minutes: 30
        run: timeout 29m pnpm --filter @prosopo/widget-skeleton exec playwright install --with-deps chromium

      - run: timeout 29m pnpm --filter @prosopo/widget-skeleton run test:browser
        timeout-minutes: 30

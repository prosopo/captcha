name: tag_release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

defaults:
  run:
    shell: bash

jobs:
  tag:
    name: Tag Release
    # GH_RUNNER unset -> GitHub-hosted. Set to a JSON array (the self-hosted
    # fleet) -> this job's capacity requirement is appended to it: cores, RAM,
    # disk. Runners advertise one label per step up to their own size, so a job
    # only lands on a host big enough for it. Set to a JSON string -> used as
    # given, which is how a repo opts back out to a hosted runner.
    runs-on: ${{ vars.GH_RUNNER && startsWith(vars.GH_RUNNER, '[') && fromJSON(format('["{0}","2c","4g","20d"]', join(fromJSON(vars.GH_RUNNER), '","'))) || fromJSON(vars.GH_RUNNER || '"ubuntu-latest"') }}
    # Only run if PR was merged and title starts with "Release"
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'Release v')
    steps:
      - name: Get token for gh app
        id: app_token
        uses: peter-murray/workflow-application-token-action@v5
        with:
          application_id: ${{ vars.PROSOPONATOR_APP_ID }}
          application_private_key: ${{ secrets.PROSOPONATOR_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - name: Git config
        run: |
          git config user.name "prosoponator[bot]"
          git config user.email "dev@prosopo.io"

      - name: Get root version
        id: version
        run: |
          root_version=$(cat package.json | jq -r '.version')
          echo "root_version=$root_version" >> $GITHUB_OUTPUT
          echo "Root version: $root_version"

      - name: Create tag
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          root_version="${{ steps.version.outputs.root_version }}"
          echo "Tagging v$root_version"
          git tag "v$root_version" || echo "Tag already exists, skipping"
          git push origin --tags


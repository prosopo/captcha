# Tags release PRs so the publish workflow knows what to ship.
# Shared actions: https://github.com/prosopo/github_actions. Runners: https://github.com/prosopo/gh-runner.
name: tag_release

on:
  pull_request:
    types: [closed]
    branches:
      - main

permissions:
  contents: write
  pull-requests: read

defaults:
  run:
    shell: bash

# Fork guard on every job: a PR from a fork never runs here. Jobs hold
# secrets and write shared caches that later trusted jobs restore, so fork
# code must not run in them (https://github.com/prosopo/gh-runner).
jobs:
  tag:
    name: Tag Release
    timeout-minutes: 5
    # Hosted, deliberately, and not routed through `vars.GH_RUNNER` like the
    # other repos: this repository is public, so a fork PR would run on the
    # self-hosted fleet -- executing arbitrary contributor code on hardware we
    # own, where it can also persist and poison later trusted jobs. Nothing is
    # given up by staying hosted: standard GitHub-hosted runners are free and
    # unlimited on public repos, macOS and Windows included. Only *larger*
    # runners are billed, so do not "upgrade" a job to one.
    # https://docs.github.com/en/billing/reference/actions-runner-pricing
    runs-on: ubuntu-latest
    # Only run if PR was merged and title starts with "Release"
    if: ${{ (github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'Release v')) && github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - name: Get token for gh app
        timeout-minutes: 5
        id: app_token
        uses: prosopo/github_actions/.github/actions/app-token@0f332e76cb54093f6130fa9bdee5b54a9f870de9  # main
        with:
          application-id: ${{ vars.PROSOPONATOR_APP_ID }}
          application-private-key: ${{ secrets.PROSOPONATOR_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          submodules: 'recursive'
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        timeout-minutes: 5
        with:
          node-version: '24.22.1'

      - name: Git config
        timeout-minutes: 5
        run: |
          git config user.name "prosoponator[bot]"
          git config user.email "dev@prosopo.io"

      - name: Get root version
        timeout-minutes: 5
        id: version
        run: |
          root_version=$(cat package.json | jq -r '.version')
          echo "root_version=$root_version" >> $GITHUB_OUTPUT
          echo "Root version: $root_version"

      - name: Create tag
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          root_version="${{ steps.version.outputs.root_version }}"
          echo "Tagging v$root_version"
          git tag "v$root_version" || echo "Tag already exists, skipping"
          git push origin --tags


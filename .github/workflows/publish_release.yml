# Publishes packages after release commits land on main, so releases need no manual steps.
# Shared actions: https://github.com/prosopo/github_actions. Runners: https://github.com/prosopo/gh-runner.
name: publish_release

# A push to main tags every package whose version changed (tag-versions), and
# publishes when that created a cli-v<version> tag: create_release_pr names
# each release after @prosopo/cli. Tagging and publishing stay in this one
# file because npm trusted publishing is bound to its filename.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: "Where the jobs run: auto (GH_RUNNER_MAP, else hosted), hosted or self-hosted. Fork PRs are always hosted."
        type: choice
        options: [auto, hosted, self-hosted]
        default: auto
      version:
        description: '@prosopo/cli version to re-publish from its cli-v<version> tag (e.g., 1.2.3)'
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Dependency debuginfo dominates a dev build and nothing here steps through
  # third-party code; incremental state is worthless on a cold CI runner.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NODE_ENV: "production"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ inputs.version || github.sha }}
  cancel-in-progress: false

jobs:
  runner:
    # Hosted vs self-hosted for the jobs below (precedence in pick-runner.yml).
    # Public repo, so keep it out of GH_RUNNER_MAP: fork PRs are hosted regardless,
    # and standard hosted runners are free and unlimited on public repos, so the
    # fleet buys nothing. Only *larger* runners are billed; do not add size labels.
    # https://docs.github.com/en/billing/reference/actions-runner-pricing
    # workflow-lint: allow pr-types -- not skipped on drafts or forks: every job below reads runs-on from it
    uses: prosopo/github_actions/.github/workflows/pick-runner.yml@aa71b53c10f350e217c92ebe31beed8bd114a587  # main
    permissions:
      contents: read
      pull-requests: read
    with:
      actions-ref: aa71b53c10f350e217c92ebe31beed8bd114a587
      workflow: publish_release
      runner: ${{ inputs.runner || 'auto' }}

  tag:
    name: Tag changed versions
    if: ${{ github.event_name == 'push' }}
    timeout-minutes: 60
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.default) }}
    permissions:
      contents: write
    outputs:
      cli-version: ${{ steps.cli.outputs.version }}
    steps:
      - name: Get token for gh app
        timeout-minutes: 5
        id: app_token
        uses: prosopo/github_actions/.github/actions/app-token@0f332e76cb54093f6130fa9bdee5b54a9f870de9  # main
        with:
          application-id: ${{ vars.PROSOPONATOR_APP_ID }}
          application-private-key: ${{ secrets.PROSOPONATOR_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0

      - name: Git config
        timeout-minutes: 1
        run: |
          git config user.name "prosoponator[bot]"
          git config user.email "dev@prosopo.io"

      - id: tags
        timeout-minutes: 3
        uses: prosopo/github_actions/.github/actions/tag-versions@610dcc91a6beee73d462b7ebe38b408ab2c02bcc  # main
        with:
          before: ${{ github.event.before }}
          after: ${{ github.sha }}

      - id: cli
        name: Pick out the cli tag
        timeout-minutes: 1
        env:
          TAGS: ${{ steps.tags.outputs.tags }}
        run: |
          echo "tags: $TAGS"
          version=$(jq -r '.[] | select(startswith("cli-v")) | ltrimstr("cli-v")' <<<"$TAGS")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish Release
    needs: [runner, tag]
    if: ${{ !cancelled() && needs.runner.result == 'success' && (github.event_name == 'workflow_dispatch' || needs.tag.outputs.cli-version != '') }}
    timeout-minutes: 60
    permissions:
      contents: write
      packages: write
      # Required so pnpm can mint an OIDC token for trusted publishing.
      # Without this, `pnpm publish` falls back to legacy NPM_TOKEN auth.
      # See https://docs.npmjs.com/trusted-publishers
      id-token: write
    runs-on: ${{ fromJSON(needs.runner.outputs.default) }}
    steps:
      - name: Get token for gh app
        timeout-minutes: 5
        id: app_token
        uses: prosopo/github_actions/.github/actions/app-token@0f332e76cb54093f6130fa9bdee5b54a9f870de9  # main
        with:
          application-id: ${{ vars.PROSOPONATOR_APP_ID }}
          application-private-key: ${{ secrets.PROSOPONATOR_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 30
        with:
          submodules: 'recursive'
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0
          ref: refs/tags/cli-v${{ inputs.version || needs.tag.outputs.cli-version }}

      - name: Setup node and pnpm
        timeout-minutes: 30
        uses: prosopo/github_actions/.github/actions/setup-pnpm@0f332e76cb54093f6130fa9bdee5b54a9f870de9  # main
        with:
          node-version: '24.22.1'
          node-cache: 'pnpm'
          store-path: ''
          run-install: 'false'

      - name: Log in to Docker Hub
        timeout-minutes: 30
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get version from tag or input
        timeout-minutes: 5
        id: version
        env:
          VERSION: ${{ inputs.version || needs.tag.outputs.cli-version }}
        run: |
          version="$VERSION"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

      - name: Preflight publishability check
        timeout-minutes: 30
        # Runs before the install and build because it needs neither, and a
        # release that cannot publish should fail in seconds rather than after
        # three minutes of building artifacts nobody will ship.
        #
        # `changeset publish` publishes serially and cannot roll back, so a
        # package that fails part way through leaves the release half-applied,
        # with the earlier packages already live and immutable on the registry.
        # This turns that into a failure before anything is published. It
        # catches the two ways a package is unpublishable: a first publish
        # (trusted publishing cannot bootstrap a package that does not exist
        # yet, and the registry rejects it with a misleading auth error) and a private
        # workspace package leaked into a published package's runtime deps.
        run: node .github/scripts/check-publishable.mjs

      - run: timeout 29m pnpm install --frozen-lockfile --ignore-scripts --prefer-offline
        timeout-minutes: 30

      - name: Build packages
        timeout-minutes: 30
        run: |
          echo "Building all packages in production mode"
          NODE_ENV=production timeout 29m pnpm run build:all:tsc
          NODE_ENV=production timeout 29m pnpm run build:all
          NODE_ENV=production timeout 29m pnpm run build:all:cjs

      - name: Bundle the production provider CLI
        timeout-minutes: 30
        run: |
          echo "Bundling provider CLI"
          NODE_ENV="production" timeout 29m pnpm --filter @prosopo/cli run bundle

      - name: Verify production build
        timeout-minutes: 30
        run: |
          echo "Verifying production builds..."
          if grep -r "@emotion/react/jsx-runtime" integration/frameworks/react/react-procaptcha-wrapper/dist/ 2>/dev/null; then
            echo "❌ ERROR: Dev build detected in react-procaptcha-wrapper - found @emotion/react/jsx-runtime"
            exit 1
          fi
          if grep -r "@emotion/vue/jsx-runtime" integration/frameworks/vue/vue-procaptcha-wrapper/dist/ 2>/dev/null; then
            echo "❌ ERROR: Dev build detected in vue-procaptcha-wrapper - found @emotion/vue/jsx-runtime"
            exit 1
          fi
          echo "✅ Build verification passed"

      - name: Publish to npm
        timeout-minutes: 30
        # Trusted publishing: pnpm auto-exchanges the GitHub OIDC token
        # (granted via `id-token: write` above) for a short-lived registry
        # token. No NPM_TOKEN secret required. Each workspace package must
        # be registered as a trusted publisher on npmjs.com pointing at
        # this workflow file.
        #
        # `npm --workspaces publish` blindly tries every workspace which
        # fails the whole release the moment one package is already at
        # its current version on the registry (the common case in a
        # changeset-driven monorepo — only bumped packages get fresh
        # versions). `changeset publish` consults `.changeset/` + the
        # registry and only publishes packages whose local version is
        # ahead of npm.
        #
        # changeset publish runs `pnpm publish` because pnpm-lock.yaml sits at
        # the repo root; `npm publish` would ship the literal `workspace:*`
        # specifiers, which pnpm replaces with the real versions.
        #
        # PNPM_CONFIG_PROVENANCE=true is the env-var form of
        # `pnpm publish --provenance` (pnpm 11 ignores NPM_CONFIG_*), so each
        # tarball gets a Sigstore attestation linking it to this workflow run.
        # Provenance verification requires `repository.url` on every
        # published manifest to match the OIDC claim.
        env:
          PNPM_CONFIG_PROVENANCE: 'true'
        run: |
          # A version npm is still running its automated review over is
          # "staged": uploaded, not yet servable, and impossible to publish
          # over -- every retry gets `409 Cannot publish over previously staged
          # version`. That is a queue we wait out, not a failure to act on, and
          # failing the job here strands everything after it: the docker image,
          # the GitHub release and the private release PR never happen, so a
          # release that npm will finish on its own stays undelivered.
          #
          # So a staged-version conflict warns and continues. Any other publish
          # error still fails the job.
          set -o pipefail
          echo "Publishing changed packages via @changesets/cli"
          if timeout 29m pnpm exec changeset publish 2>&1 | tee /tmp/changeset-publish.log; then
            exit 0
          fi
          if grep -q "Cannot publish over previously staged version" /tmp/changeset-publish.log; then
            echo "::warning::npm is still validating a version uploaded by an earlier run; it goes live when that review finishes. Continuing so the rest of the release ships."
            exit 0
          fi
          exit 1

      - name: Publish production image to Docker Hub
        timeout-minutes: 30
        run: |
          echo "Publishing production provider image to Docker Hub"
          NODE_ENV="production" timeout 29m pnpm --filter @prosopo/cli run build:docker
          NODE_ENV="production" timeout 29m pnpm --filter @prosopo/cli run publish:docker

      - name: Bundle the staging provider CLI
        timeout-minutes: 30
        run: |
          echo "Bundling provider CLI"
          NODE_ENV="staging" timeout 29m pnpm --filter @prosopo/cli run bundle

      - name: Publish production image to Docker Hub
        timeout-minutes: 30
        run: |
          echo "Publishing staging provider image to Docker Hub"
          NODE_ENV="staging" timeout 29m pnpm --filter @prosopo/cli run build:docker
          NODE_ENV="staging" timeout 29m pnpm --filter @prosopo/cli run publish:docker

      - name: Create GitHub Release
        timeout-minutes: 5
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          timeout 4m gh release create "cli-v${{ steps.version.outputs.version }}" \
            --title "Release cli-v${{ steps.version.outputs.version }}" \
            --generate-notes

      - name: Open the private release PR
        timeout-minutes: 5
        # The release is not finished when this repo's packages are out: the
        # private repo still has to move its captcha submodule to the new tag,
        # cascade the version bumps through its own packages and repoint the
        # ansible inventories at the new provider image. Its create_release_pr
        # workflow does all of that, but it was dispatch-only, so it happened
        # only when somebody remembered. v3.8.7 and v3.8.8 both shipped from
        # here with no release PR opened there at all, and production's
        # compose_provider_image_version was hand-edited to 3.8.7 in an
        # unrelated PR to paper over it.
        #
        # Fired after the GitHub Release exists so the private side never opens
        # a PR for a release that did not finish. Non-fatal on purpose: at this
        # point the packages, images and release are already published, and
        # failing here would both mark a successful release as failed and fire
        # the failure notification below. A missed dispatch just means running
        # create_release_pr by hand, which is where this started.
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          timeout 4m gh api repos/prosopo/captcha-private/dispatches \
            --method POST \
            --field event_type=captcha_released \
            --field 'client_payload[version]=${{ steps.version.outputs.version }}'

      - name: Send success notification
        timeout-minutes: 5
        if: success()
        run: |
          timeout 4m curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"Release cli-v${{ steps.version.outputs.version }} published successfully\"}" \
            "${{ secrets.SLACKBOT_DEVOPS }}"

      - name: Send failure notification
        timeout-minutes: 5
        if: failure()
        run: |
          timeout 4m curl -X POST -H 'Content-type: application/json' \
            --data "{\"text\": \"Release cli-v${{ steps.version.outputs.version }} failed to publish\"}" \
            "${{ secrets.SLACKBOT_DEVOPS }}"

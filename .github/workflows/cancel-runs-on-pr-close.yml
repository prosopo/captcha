# On PR merge/close: cancel that PR's in-flight runs and delete its GitHub
# cache entries. Logic and the reasons for it live in the shared workflow:
# https://github.com/prosopo/github_actions (.github/workflows/cancel-runs-on-pr-close.yml).

name: cancel-runs-on-pr-close

on:
  pull_request:
    types: [closed]

permissions:
  contents: read

# Fork guard on every job: a PR from a fork never runs here. Jobs hold
# secrets and write shared caches that later trusted jobs restore, so fork
# code must not run in them (https://github.com/prosopo/gh-runner).
defaults:
  run:
    shell: bash

jobs:
  cancel:
    permissions:
      actions: write
      contents: read
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    uses: prosopo/github_actions/.github/workflows/cancel-runs-on-pr-close.yml@0f332e76cb54093f6130fa9bdee5b54a9f870de9  # main

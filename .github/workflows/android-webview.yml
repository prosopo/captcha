# Builds and tests the Android WebView integration on PRs, since the widget behaves differently inside WebViews.
# Shared actions: https://github.com/prosopo/github_actions. Runners: https://github.com/prosopo/gh-runner.
name: android-webview

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      # Not a type this workflow wants to run for -- the job below skips it. It
      # exists so the run is created and cancels the in-flight one.
      - converted_to_draft
      - ready_for_review
    paths:
      - "demos/android-webview/**"
      - ".github/workflows/android-webview.yml"

# Least privilege: both jobs only check out the repo and build it, so read
# access to contents is the whole requirement. Without this the workflow
# inherits the repository default, which is write on several scopes -- and this
# repository is public, so a workflow that builds a fork's code is exactly
# where a broad token should not be handed out.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Fork guard on every job: a PR from a fork never runs here. Jobs hold
# secrets and write shared caches that later trusted jobs restore, so fork
# code must not run in them (https://github.com/prosopo/gh-runner).
defaults:
  run:
    shell: bash

jobs:
  runner:
    # Hosted vs self-hosted for the jobs below (precedence in pick-runner.yml).
    # Public repo, so keep it out of GH_RUNNER_MAP: fork PRs are hosted regardless,
    # and standard hosted runners are free and unlimited on public repos, so the
    # fleet buys nothing. Only *larger* runners are billed; do not add size labels.
    # https://docs.github.com/en/billing/reference/actions-runner-pricing
    # workflow-lint: allow pr-types -- not skipped on drafts or forks: every job below reads runs-on from it
    uses: prosopo/github_actions/.github/workflows/pick-runner.yml@aa71b53c10f350e217c92ebe31beed8bd114a587  # main
    permissions:
      contents: read
      pull-requests: read
    with:
      actions-ref: aa71b53c10f350e217c92ebe31beed8bd114a587
      workflow: android-webview

  build:
    name: android-webview
    timeout-minutes: 60
    if: ${{ (github.event.pull_request.draft != true) && github.event.pull_request.head.repo.full_name == github.repository }}
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.default) }}
    defaults:
      run:
        working-directory: demos/android-webview
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5

      # 17, not the app's own jvmTarget: that is the bytecode level the app
      # compiles *to*, while the Android Gradle Plugin itself needs a JDK 17.
      - name: Set up JDK 17
        timeout-minutes: 30
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad  # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        timeout-minutes: 30
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd  # v4.0.4
        with:
          # Drop the action's default `tools platform-tools`. `tools` is an
          # obsolete SDK package that Google has removed from the repository,
          # and it is what broke this job: the runner image ships cmdline-tools
          # 12.0, the action decides that is the "wrong version" and downloads
          # 20.0, and 20.0 cannot resolve `tools` at all --
          # `Warning: Failed to find package 'tools'`, then exit 1. Licence
          # acceptance was never the problem; it succeeded on the line above.
          #
          # `platform-tools` is the half that is real (adb and friends). Gradle
          # resolves the build-tools and platform it needs on its own.
          packages: platform-tools

      - name: Gradle build + unit tests
        timeout-minutes: 30
        run: ./gradlew --no-daemon --stacktrace testReleaseUnitTest assembleRelease

# Run the cypress suite in firefox.
#
# Split out from cypress.yml rather than added to it as a second job so that
# cypress.yml stays byte-identical to main. The main ruleset requires a status
# check named `check`, which is why every workflow here has exactly one job by
# that name — this one included.
#
# Firefox is the slower, narrower run, so it is reserved for release PRs —
# create_release_pr.yml opens those as "Release vX.Y.Z" off a release/X.Y.Z
# branch. The job `if` matches either, and github's string comparisons are
# case-insensitive, so "release" in any casing counts.
#
# Heads up: a workflow file that differs from the copy on the default branch
# schedules no jobs on this repo — the run completes straight away with
# conclusion `action_required` and needs approving in the Actions UI. That
# applies to this file until it lands on main.

name: cypress-firefox

on:
  pull_request:
    branches: [main, dev, staging, release/*]
    types:
      - opened # when a PR is opened
      - synchronize # when a PR is pushed to
      - reopened # when a PR is reopened
      - ready_for_review # when a PR is marked as ready for review (e.g. taken off draft mode)
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
  GH_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: "--max-old-space-size=4096"
  NODE_ENV: "test"
  # Required for self-signed HTTPS certificates in test environment
  NODE_TLS_REJECT_UNAUTHORIZED: "0"

defaults:
  run:
    shell: bash

jobs:
  check:
    # GH_RUNNER unset -> GitHub-hosted. Set to a JSON array (the self-hosted
    # fleet) -> this job's capacity requirement is appended to it: cores, RAM,
    # disk. Runners advertise one label per step up to their own size, so a job
    # only lands on a host big enough for it. Set to a JSON string -> used as
    # given, which is how a repo opts back out to a hosted runner.
    runs-on: ${{ vars.GH_RUNNER && startsWith(vars.GH_RUNNER, '[') && fromJSON(format('["{0}","4c","8g","40d"]', join(fromJSON(vars.GH_RUNNER), '","'))) || fromJSON(vars.GH_RUNNER || '"ubuntu-latest"') }}
    # `concurrently --kill-others` does not reliably reap the service processes
    # when the cypress command exits non-zero, so a failing suite leaves the job
    # sitting there until the 6h default. Chrome never trips this because it
    # passes; firefox is new, so bound it.
    timeout-minutes: 45
    if: >-
      github.event.pull_request.draft == false &&
      (contains(github.event.pull_request.title, 'release') ||
       contains(github.head_ref || github.ref_name, 'release'))
    env:
      # Read by the cypress:run:* scripts in @prosopo/cypress-shared. Not
      # CYPRESS_-prefixed on purpose: cypress would read it as a config key.
      PROSOPO_CYPRESS_BROWSER: firefox
      # cypress-real-events drives input over the chrome devtools protocol, so
      # under firefox the specs fall back to cypress' synthetic clicks, which
      # the widget's isEventTrusted() gate drops. Build the bundle with the
      # gate open — the define is pinned false on production builds, so it
      # can't follow the bundle out of CI.
      PROSOPO_ALLOW_UNTRUSTED_EVENTS: "1"
    steps:
      - name: Print contexts
        uses: prosopo/github_actions/.github/actions/print_contexts@a8f2d18145fedb774d5aacbde7b617c6c8852475 # main
        with:
          INPUTS_CONTEXT: ${{ toJson(inputs) }}
          NEEDS_CONTEXT: ${{ toJson(needs) }}
          VARS_CONTEXT: ${{ toJson(vars) }}
          SECRETS_CONTEXT: ${{ toJson(secrets) }}

      - name: Set NX_PARALLEL environment variable
        run: echo "NX_PARALLEL=$(nproc)" >> $GITHUB_ENV

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PROSOPONATOR_PAT }}
          submodules: "recursive"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      - uses: prosopo/github_actions/.github/actions/npm@a8f2d18145fedb774d5aacbde7b617c6c8852475 # main
        with:
          npm_ci_args: '--include=dev --no-audit --no-fund --prefer-offline'

      - name: Install firefox
        run: |
          set -euo pipefail
          if command -v firefox >/dev/null 2>&1; then
            firefox --version
            exit 0
          fi
          # Ubuntu's own `firefox` package is a snap shim that cypress can't
          # drive, so take the real deb from Mozilla's apt repo instead.
          sudo install -d -m 0755 /etc/apt/keyrings
          curl -fsSL https://packages.mozilla.org/apt/repo-signing-key.gpg \
            | sudo tee /etc/apt/keyrings/packages.mozilla.org.asc > /dev/null
          echo "deb [signed-by=/etc/apt/keyrings/packages.mozilla.org.asc] https://packages.mozilla.org/apt mozilla main" \
            | sudo tee /etc/apt/sources.list.d/mozilla.list > /dev/null
          printf 'Package: *\nPin: origin packages.mozilla.org\nPin-Priority: 1000\n' \
            | sudo tee /etc/apt/preferences.d/mozilla > /dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends firefox
          firefox --version

      # setup certs
      - name: Setup certs
        run: |
          ./setup_certs.sh
          ./install_cert.sh

      - name: Trust the dev cert in firefox
        run: |
          set -euo pipefail
          # install_cert.sh only reaches the system store and chrome's NSS db.
          # Firefox keeps its own trust store, so hand it the cert through an
          # enterprise policy instead.
          sudo install -d -m 0755 /etc/firefox/policies
          printf '{"policies":{"Certificates":{"ImportEnterpriseRoots":true,"Install":["%s/certs/server.crt"]}}}\n' \
            "$GITHUB_WORKSPACE" | sudo tee /etc/firefox/policies/policies.json > /dev/null
          cat /etc/firefox/policies/policies.json

      - name: Setup env
        run: |
          set -euxo pipefail # stop on errors, print commands, fail on pipe fails

          cp demos/client-example-server/env.development demos/client-example-server/.env.test
          cp demos/client-bundle-example/env.development demos/client-bundle-example/.env.test
          cp dev/scripts/env.test .env.test
          cp dev/scripts/env.test dev/scripts/.env.test
          cp dev/scripts/env.test packages/cli/.env.test
          cp dev/scripts/env.test packages/procaptcha-bundle/.env.test

          # Update URLs to use HTTPS since certificates are present
          sed -i 's|http://localhost|https://localhost|g' demos/client-bundle-example/.env.test
          sed -i 's|http://localhost|https://localhost|g' .env.test
          sed -i 's|http://localhost|https://localhost|g' dev/scripts/.env.test
          sed -i 's|http://localhost|https://localhost|g' packages/cli/.env.test
          sed -i 's|http://localhost|https://localhost|g' packages/procaptcha-bundle/.env.test

          # Change PROSOPO_VERIFICATION_TYPE to local
          sed -i '/^PROSOPO_VERIFICATION_TYPE=/s/=.*/=local/' demos/client-example-server/.env.test

          echo NODE_ENV: "$NODE_ENV"

      # build all packages in workspace
      - run: npx turbo run build

      - name: Start the docker images
        run: |
          docker compose --file ./docker/docker-compose.test.yml up -d --remove-orphans --force-recreate --always-recreate-deps
          docker container ls
          sleep 10s

      # deploy dapp + protocol and run setup to register, stake and load a dataset for a provider
      - run: NODE_ENV="test" npm run setup

      # Build a test version of the procaptcha bundle and run the cypress tests on it and on the React client-example
      # Running using NODE_ENV=development instead of NODE_ENV=production means the bundle will be built with selectors that can be used
      # by the cypress tests to find the elements they need to interact with
      - run: NODE_ENV="development" npx turbo run @prosopo/procaptcha-bundle#bundle

      - name: Run the cypress tests on client-bundle-example
        run: |
          npx concurrently "npm run start:server" "npm run start:provider:admin" "npm run start:bundle" "npm run serve:bundle" "npx tsx ./demos/cypress-shared/scripts/wait-for-services.ts && npm -w @prosopo/cypress-shared run cypress:run:client-bundle-example:image" --success "first" --kill-others

      - name: Run the cypress tests on client-bundle-example explicit rendering with frictionless captcha
        env:
          # Committed test detector-pool fixture (throwaway keys) so the browser
          # is served a real per-session bundle and frictionless runs genuine
          # detection instead of the empty-pool PoW fallback.
          PROSOPO_DETECTOR_POOL_DIR: ${{ github.workspace }}/packages/provider/fixtures/detector-pool
        run: |
          npx concurrently "npm run start:server" "npm run start:provider:admin" "npm run start:bundle" "npm run serve:bundle" "npx tsx ./demos/cypress-shared/scripts/wait-for-services.ts && npm -w @prosopo/cypress-shared run cypress:run:client-bundle-example:frictionless" --success "first" --kill-others

      - name: Run the cypress tests on client-bundle-example explicit rendering with pow captcha
        run: |
          npx concurrently "npm run start:server" "npm run start:provider:admin" "npm run start:bundle" "npm run serve:bundle" "npx tsx ./demos/cypress-shared/scripts/wait-for-services.ts && npm -w @prosopo/cypress-shared run cypress:run:client-bundle-example:pow" --success "first" --kill-others

      - name: Run the cypress tests on client-bundle-example explicit rendering with puzzle captcha
        run: |
          npx concurrently "npm run start:server" "npm run start:provider:admin" "npm run start:bundle" "npm run serve:bundle" "npx tsx ./demos/cypress-shared/scripts/wait-for-services.ts && npm -w @prosopo/cypress-shared run cypress:run:client-bundle-example:puzzle" --success "first" --kill-others

      - name: Run the cypress tests on client-bundle-example explicit rendering with invisible captcha
        run: |
          npx concurrently "npm run start:server" "npm run start:provider:admin" "npm run start:bundle" "npm run serve:bundle" "npx tsx ./demos/cypress-shared/scripts/wait-for-services.ts && npm -w @prosopo/cypress-shared run cypress:run:client-bundle-example:invisible" --success "first" --kill-others

      - name: Run the cypress tests for the post-PoW route() escalation flow
        env:
          # Headless cypress can't produce a server-decryptable detector
          # token, so without this override the frictionless flow short-
          # circuits to image on every request and route() is never reached.
          # Confined to this CI step + an explicit env-var name so prod can't
          # set it by accident.
          PROSOPO_TEST_FRICTIONLESS_DETECTOR_OVERRIDE: "1"
        run: |
          npx concurrently "npm run start:server" "npm run start:provider:admin" "npm run start:bundle" "npm run serve:bundle" "npx tsx ./demos/cypress-shared/scripts/wait-for-services.ts && npm -w @prosopo/cypress-shared run cypress:run:client-bundle-example:escalation" --success "first" --kill-others

      - name: Run the cypress tests for the frictionless-phase routing machine
        env:
          # Same reason as escalation — the routing machine only reaches
          # its route() phase when the detector override lets frictionless
          # short-circuit fire without a real signed detector payload.
          PROSOPO_TEST_FRICTIONLESS_DETECTOR_OVERRIDE: "1"
          # This spec asserts the frictionless-phase captchaType directly
          # (escalation/postPowPuzzle assert the post-PoW one, so they can
          # start from PoW). On an empty pool runNoDetectorPowFallback
          # answers before setRoutingContext runs, so route() is never
          # invoked and every case returns the PoW baseline. The committed
          # fixture pool keeps that fallback declined.
          PROSOPO_DETECTOR_POOL_DIR: ${{ github.workspace }}/packages/provider/fixtures/detector-pool
        run: |
          npx concurrently "npm run start:server" "npm run start:provider:admin" "npm run start:bundle" "npm run serve:bundle" "npx tsx ./demos/cypress-shared/scripts/wait-for-services.ts && npm -w @prosopo/cypress-shared run cypress:run:client-bundle-example:routingFrictionless" --success "first" --kill-others

      - name: Run the cypress tests for the post-PoW route() escalation to puzzle
        env:
          PROSOPO_TEST_FRICTIONLESS_DETECTOR_OVERRIDE: "1"
        run: |
          npx concurrently "npm run start:server" "npm run start:provider:admin" "npm run start:bundle" "npm run serve:bundle" "npx tsx ./demos/cypress-shared/scripts/wait-for-services.ts && npm -w @prosopo/cypress-shared run cypress:run:client-bundle-example:postPowPuzzle" --success "first" --kill-others

      - name: Run the cypress tests for decide() decision machine deny at verify — image
        run: |
          npx concurrently "npm run start:server" "npm run start:provider:admin" "npm run start:bundle" "npm run serve:bundle" "npx tsx ./demos/cypress-shared/scripts/wait-for-services.ts && npm -w @prosopo/cypress-shared run cypress:run:client-bundle-example:decisionMachineDeny" --success "first" --kill-others

      - name: Run the cypress tests for decide() decision machine deny at verify — pow
        run: |
          npx concurrently "npm run start:server" "npm run start:provider:admin" "npm run start:bundle" "npm run serve:bundle" "npx tsx ./demos/cypress-shared/scripts/wait-for-services.ts && npm -w @prosopo/cypress-shared run cypress:run:client-bundle-example:decisionMachineDenyPow" --success "first" --kill-others

      - name: Run the cypress tests for decide() decision machine deny at verify — puzzle
        run: |
          npx concurrently "npm run start:server" "npm run start:provider:admin" "npm run start:bundle" "npm run serve:bundle" "npx tsx ./demos/cypress-shared/scripts/wait-for-services.ts && npm -w @prosopo/cypress-shared run cypress:run:client-bundle-example:decisionMachineDenyPuzzle" --success "first" --kill-others

      - name: Run the cypress tests for user access policy blocks (request-time + defer-to-verify)
        run: |
          npx concurrently "npm run start:server" "npm run start:provider:admin" "npm run start:bundle" "npm run serve:bundle" "npx tsx ./demos/cypress-shared/scripts/wait-for-services.ts && npm -w @prosopo/cypress-shared run cypress:run:client-bundle-example:accessPolicy" --success "first" --kill-others

      - name: Run the cypress tests for user access policy Restrict rules
        run: |
          npx concurrently "npm run start:server" "npm run start:provider:admin" "npm run start:bundle" "npm run serve:bundle" "npx tsx ./demos/cypress-shared/scripts/wait-for-services.ts && npm -w @prosopo/cypress-shared run cypress:run:client-bundle-example:accessPolicyRestrict" --success "first" --kill-others

      - name: Run the cypress tests for user access policy conflict resolution (specificity + harshness)
        run: |
          npx concurrently "npm run start:server" "npm run start:provider:admin" "npm run start:bundle" "npm run serve:bundle" "npx tsx ./demos/cypress-shared/scripts/wait-for-services.ts && npm -w @prosopo/cypress-shared run cypress:run:client-bundle-example:accessPolicyConflicts" --success "first" --kill-others

      # after the test run completes store videos and any screenshots
      - uses: actions/upload-artifact@v7
        # store screenshots only on failures
        if: failure()
        with:
          name: cypress-screenshots-firefox
          path: ./demos/cypress-shared/cypress/screenshots
          if-no-files-found: ignore  # 'warn' or 'error' are also available, defaults to `warn`

      # after the test run completes store videos and any screenshots
      - uses: actions/upload-artifact@v7
        # store videos only on failures
        if: failure()
        with:
          name: cypress-videos-firefox
          path: ./demos/cypress-shared/cypress/videos
          if-no-files-found: ignore   # 'warn' or 'error' are also available, defaults to `warn`

      # visual-regression diffs (and the actual frames that produced them) when snapshots don't match
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: cypress-snapshot-diffs-firefox
          path: |
            ./demos/cypress-shared/cypress/snapshots/diff
            ./demos/cypress-shared/cypress/snapshots/actual
          if-no-files-found: ignore

      - run: docker compose --file ./docker/docker-compose.test.yml down

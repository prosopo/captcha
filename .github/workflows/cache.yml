# Build a cache of build artifacts after PRs to speed up subsequent builds

name: cache

on:
  push:
    branches: [main, dev, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
  GH_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
  CARGO_TERM_COLOR: always
  NODE_OPTIONS: "--max-old-space-size=4096"
  NODE_ENV: "test"

defaults:
  run:
    shell: bash

jobs:
  build:
    # GH_RUNNER unset -> GitHub-hosted. Set to a JSON array (the self-hosted
    # fleet) -> this job's capacity requirement is appended to it: cores, RAM,
    # disk. Runners advertise one label per step up to their own size, so a job
    # only lands on a host big enough for it. Set to a JSON string -> used as
    # given, which is how a repo opts back out to a hosted runner.
    runs-on: ${{ vars.GH_RUNNER && startsWith(vars.GH_RUNNER, '[') && fromJSON(format('["{0}","4c","8g","40d"]', join(fromJSON(vars.GH_RUNNER), '","'))) || fromJSON(vars.GH_RUNNER || '"ubuntu-latest"') }}
    steps:
      - name: Print contexts
        uses: prosopo/github_actions/.github/actions/print_contexts@7c4a3922c80bd2b7ca90cdedebd226bd0439467e # main
        with:
          INPUTS_CONTEXT: ${{ toJson(inputs) }}
          NEEDS_CONTEXT: ${{ toJson(needs) }}
          VARS_CONTEXT: ${{ toJson(vars) }}
          SECRETS_CONTEXT: ${{ toJson(secrets) }}

      - name: Set NX_PARALLEL environment variable
        run: echo "NX_PARALLEL=$(nproc)" >> $GITHUB_ENV

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PROSOPONATOR_PAT }}
          submodules: "recursive"

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'

      # don't restore the cache, otherwise we get artifacts left over from the previous run sit in the cache for eternity. Do a clean build every time.
      - run: npm cache clean --force

      - uses: prosopo/github_actions/.github/actions/npm@7c4a3922c80bd2b7ca90cdedebd226bd0439467e # main
        with:
          npm_ci_args: '--include=dev --no-audit --no-fund --prefer-offline'

      # clean the nx cache
      - run: npx nx reset
      - run: npm run clean:turbo

      # install cypress so we don't have to do that every time
      - run: npx cypress install

      # build everything so it's cached
      - run: npx turbo run typecheck
      - run: npx turbo run build
      - run: npx turbo run build:cjs
      - run: npx turbo run bundle
      - run: NODE_ENV=development npx turbo run bundle:webpack

      - name: Save npm cache
        uses: prosopo/github_actions/.github/actions/save_npm_cache@7c4a3922c80bd2b7ca90cdedebd226bd0439467e # main


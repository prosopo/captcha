# Build a cache of build artifacts after PRs to speed up subsequent builds

name: cache

on:
  push:
    branches: [main, dev, staging]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
  GH_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NODE_OPTIONS: "--max-old-space-size=4096"
  NODE_ENV: "test"

defaults:
  run:
    shell: bash

jobs:
  build:
    # Hosted, deliberately, and not routed through `vars.GH_RUNNER` like the
    # other repos: this repository is public, so a fork PR would run on the
    # self-hosted fleet -- executing arbitrary contributor code on hardware we
    # own, where it can also persist and poison later trusted jobs. Nothing is
    # given up by staying hosted: standard GitHub-hosted runners are free and
    # unlimited on public repos, macOS and Windows included. Only *larger*
    # runners are billed, so do not "upgrade" a job to one.
    # https://docs.github.com/en/billing/reference/actions-runner-pricing
    runs-on: ubuntu-latest
    steps:
      - name: Print contexts
        uses: prosopo/github_actions/.github/actions/print_contexts@a8f2d18145fedb774d5aacbde7b617c6c8852475 # main
        with:
          INPUTS_CONTEXT: ${{ toJson(inputs) }}
          NEEDS_CONTEXT: ${{ toJson(needs) }}
          VARS_CONTEXT: ${{ toJson(vars) }}

      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PROSOPONATOR_PAT }}
          submodules: "recursive"

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --prefer-offline

      - run: pnpm run clean:turbo

      # install cypress so we don't have to do that every time
      - run: pnpm --filter @prosopo/cypress-shared exec cypress install

      # build everything so it's cached
      - run: pnpm exec turbo run typecheck
      - run: pnpm exec turbo run build
      - run: pnpm exec turbo run build:cjs
      - run: pnpm exec turbo run bundle
      - run: NODE_ENV=development pnpm exec turbo run bundle:webpack

      - name: Locate pnpm store
        id: pnpm_store
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          mkdir -p ~/.cache/Cypress .turbo/cache .nx/cache

      - name: Save pnpm cache
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ steps.pnpm_store.outputs.path }}
            ~/.cache/Cypress
            .turbo/cache
            .nx/cache
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Remove older pnpm caches
        run: |
          cacheKeys=$(gh cache list --sort created_at --order desc --limit 100 -R "${{ github.repository }}" --key "pnpm-${{ runner.os }}-${{ runner.arch }}-" | cut -f 1 | tail -n +3)
          set +e
          for cacheKey in $cacheKeys; do
            gh cache delete "$cacheKey" -R "${{ github.repository }}"
          done


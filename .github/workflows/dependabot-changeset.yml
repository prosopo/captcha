# Makes Dependabot PRs pass the `changesets` check (and keeps the lockfile in sync).
#
# On every Dependabot PR this:
#   1. refreshes pnpm-lock.yaml with `pnpm install` (safety; Dependabot usually does this itself),
#   2. derives which *versioned* workspace packages had their package.json changed,
#   3. writes a patch changeset for them describing the bump,
#   4. commits the lockfile + changeset back onto the PR branch.
#
# The push uses PROSOPONATOR_PAT, which MUST be added under
#   Settings > Secrets and variables > Dependabot
# because Dependabot-triggered workflow runs get a read-only GITHUB_TOKEN and no
# access to *Actions* secrets. Because the push happens as the PAT user (not
# dependabot[bot]), the resulting `synchronize` event is skipped by the actor guard
# below, so there is no re-trigger loop.
#
# `pnpm run changesets:add` is intentionally NOT used: it is interactive (prompts for
# packages + bump type) and cannot run unattended, so the changeset file is written directly.

name: dependabot-changeset

# No draft gate: dependabot never opens draft PRs, and the job is cheap.
on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Fork guard on every job: a PR from a fork never runs here. Jobs hold
# secrets and write shared caches that later trusted jobs restore, so fork
# code must not run in them (https://github.com/prosopo/gh-runner).
jobs:
  runner:
    # Hosted vs self-hosted for the jobs below (precedence in pick-runner.yml).
    # Public repo, so keep it out of GH_RUNNER_MAP: fork PRs are hosted regardless,
    # and standard hosted runners are free and unlimited on public repos, so the
    # fleet buys nothing. Only *larger* runners are billed; do not add size labels.
    # https://docs.github.com/en/billing/reference/actions-runner-pricing
    # workflow-lint: allow pr-types -- not skipped on drafts or forks: every job below reads runs-on from it
    uses: prosopo/github_actions/.github/workflows/pick-runner.yml@aa71b53c10f350e217c92ebe31beed8bd114a587  # main
    permissions:
      contents: read
      pull-requests: read
    with:
      actions-ref: aa71b53c10f350e217c92ebe31beed8bd114a587
      workflow: dependabot-changeset

  changeset:
    name: changeset
    timeout-minutes: 60
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.default) }}
    if: ${{ (github.actor == 'dependabot[bot]') && github.event.pull_request.head.repo.full_name == github.repository }}
    env:
      BASE_REF: ${{ github.event.pull_request.base.ref }}
      HEAD_REF: ${{ github.event.pull_request.head.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 10
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.PROSOPONATOR_PAT }}
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup node and pnpm
        timeout-minutes: 30
        uses: prosopo/github_actions/.github/actions/setup-pnpm@0f332e76cb54093f6130fa9bdee5b54a9f870de9  # main
        with:
          node-version-file: .nvmrc
          restore-store-cache: 'false'
          store-path: ''
          run-install: 'false'

      # Refresh the lockfile against the bumped package.json files.
      # --ignore-scripts: --lockfile-only does not install node_modules, so the
      # root `prepare` hook (husky) would otherwise fail with "husky: not found"
      # (exit 127) and abort before the lockfile is refreshed.
      - name: Update lockfile
        timeout-minutes: 30
        run: timeout 29m pnpm install --lockfile-only --ignore-scripts --prefer-offline

      - name: Generate changeset
        timeout-minutes: 5
        env:
          GH_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
        run: |
          # No --depth here: a shallow fetch cuts the base branch's history, so if the
          # base advanced after this PR branch was created/rebased, `git diff
          # origin/$BASE_REF...HEAD` in the script fails with "no merge base".
          # checkout above already ran with fetch-depth: 0, so this fetch is cheap.
          timeout 4m git fetch origin "$BASE_REF"
          node .github/scripts/dependabot-changeset.mjs

      - name: Commit and push
        timeout-minutes: 5
        run: |
          git config user.name "prosoponator[bot]"
          git config user.email "prosoponator[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit (no versioned package changed)."
            exit 0
          fi
          git commit -m "chore(deps): add changeset and refresh lockfile [dependabot-skip]"
          timeout 4m git push origin "HEAD:$HEAD_REF"

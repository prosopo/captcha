# Check the translation catalogues in packages/locale on every PR that touches
# them: one file per namespace (widget, target, translation) with the same keys
# as English's, checked at type level too; no empty or untranslated values
# (other than the curated packages/locale/src/tests/keptAsIs.ts); the right
# script for non-Latin languages; no U+FFFD or look-alike Latin letters; and
# matching {{placeholders}}.
#
# These tests also run inside tests.yml, but only after a full workspace build
# and docker stack, so a broken translation shows up there after ~30 minutes
# among hundreds of other results. This runs the catalogue tests alone in a few
# minutes and reports under its own name.

name: locales

on:
  pull_request:
    branches: [main, dev, staging, release/*]
    # Inclusion-based on purpose: the tests read nothing outside the locale
    # package. Safe against the "required check never reports" trap because the
    # required context, `check` in required-check.yml, has no path filter.
    paths:
      - 'packages/locale/**'
      - '.github/workflows/locales.yml'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    if: github.event.pull_request.draft != true
    name: locales
    # Hosted, as in lint.yml: this repository is public, so a fork PR must not
    # run on the self-hosted fleet.
    # Runs on drafts too: it is cheap, and translators iterate on drafts.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: "recursive"

      - name: Setup node and pnpm
        uses: prosopo/github_actions/.github/actions/setup-pnpm@a7252e6e2ad27703bc1a7abf63805f456a525608  # main
        with:
          node-version: '24.22.1'
          node-cache: 'pnpm'
          store-path: ''

      # vite.test.config.ts imports the built @prosopo/config and needs an
      # .env.test, and the type tests resolve locale's other workspace
      # dependencies (such as @prosopo/util) through their dist/types.
      - run: pnpm exec turbo run @prosopo/config#build build:types --filter='@prosopo/locale^...'

      - run: cp dev/scripts/env.test .env.test

      - name: Catalogue tests
        working-directory: packages/locale
        run: >-
          pnpm exec vitest run --config ./vite.test.config.ts
          src/tests/locales.unit.test.ts
          src/tests/localePlaceholders.unit.test.ts
          src/tests/translations.unit.test.ts
          src/tests/catalogues.test-d.ts

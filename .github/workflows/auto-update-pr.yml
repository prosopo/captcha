# Keeps one auto-merge PR at a time up to date with main, since this repo
# requires branches to be up to date. Picks a random eligible PR and stands
# down while any non-draft PR has CI running; how and why:
# https://github.com/prosopo/github_actions (.github/scripts/auto_update_pr.py).
#
# workflow_run fires when any listed CI workflow finishes, pass or fail: a
# pass frees the queue, a fail means the chosen PR is out and another is
# picked. push to main restarts the chosen PR straight away if its CI is still
# running on the old base. The */30 cron is only a backstop (GitHub delays
# and drops scheduled runs). Never pull_request_target: it would run with
# secrets on fork code.

name: auto-update-pr

on:
  workflow_run:
    workflows:
      - tests
      - typecheck
      - lint
      - cypress
      - cargo-test
      - security-scan
      - locales
      - pinned-versions
      - changesets
      - required-check
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: auto-update-pr
  cancel-in-progress: false

jobs:
  update:
    uses: prosopo/github_actions/.github/workflows/auto-update-pr.yml@8ed5b505b700e5bbae188a2327747ad3fb53f7fa  # main
    with:
      actions-ref: 8ed5b505b700e5bbae188a2327747ad3fb53f7fa
    secrets:
      update-token: ${{ secrets.PROSOPONATOR_PAT }}

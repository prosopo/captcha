# Supply-chain guard: ensure dependencies are pinned to exact versions.
#
# Floating ranges (^, ~, *, "latest") let `pnpm install` silently pull a newer
# release than was reviewed. Recent npm worms/hijacks abused this exact gap:
# the "Shai-Hulud" worm (Sep 2025, 500+ packages), the chalk/debug hijack
# (Sep 2025, ~2.6B weekly downloads) and the nx attack (Aug 2025). Pinning exact
# versions + committed lockfile + `pnpm install --frozen-lockfile` blocks the
# auto-pull of a bad release.

name: pinned-versions

on:
  pull_request:
    branches: [main, dev, staging, release/*]
    types:
      - opened # when a PR is opened
      - synchronize # when a PR is pushed to
      - reopened # when a PR is reopened
      - ready_for_review # when a PR is marked as ready for review (e.g. taken off draft mode)
      - converted_to_draft
  workflow_dispatch:
    inputs:
      runner:
        description: "Where the jobs run: auto (GH_RUNNER_MAP, else hosted), hosted or self-hosted. Fork PRs are always hosted."
        type: choice
        options: [auto, hosted, self-hosted]
        default: auto

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.runner }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# Fork guard on every job: a PR from a fork never runs here. Jobs hold
# secrets and write shared caches that later trusted jobs restore, so fork
# code must not run in them (https://github.com/prosopo/gh-runner).
jobs:
  runner:
    # Hosted vs self-hosted for the jobs below (precedence in pick-runner.yml).
    # Public repo, so keep it out of GH_RUNNER_MAP: fork PRs are hosted regardless,
    # and standard hosted runners are free and unlimited on public repos, so the
    # fleet buys nothing. Only *larger* runners are billed; do not add size labels.
    # https://docs.github.com/en/billing/reference/actions-runner-pricing
    # workflow-lint: allow pr-types -- not skipped on drafts or forks: every job below reads runs-on from it
    uses: prosopo/github_actions/.github/workflows/pick-runner.yml@aa71b53c10f350e217c92ebe31beed8bd114a587  # main
    permissions:
      contents: read
      pull-requests: read
    with:
      actions-ref: aa71b53c10f350e217c92ebe31beed8bd114a587
      workflow: pinned-versions
      runner: ${{ inputs.runner || 'auto' }}

  check:
    name: pinned-versions
    timeout-minutes: 60
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.default) }}
    # Skip draft PRs, but still allow manual workflow_dispatch runs (where
    # github.event.pull_request is undefined).
    if: ${{ (github.event_name != 'pull_request' || github.event.pull_request.draft != true) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        timeout-minutes: 30
        with:
          node-version-file: .nvmrc
      # No `pnpm install` needed — the check only reads package.json files and
      # pnpm-lock.yaml.
      - name: Check dependencies are pinned to exact versions
        timeout-minutes: 5
        run: node .github/scripts/check-pinned-versions.mjs

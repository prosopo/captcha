# Lints every workflow and local action under .github/ with actionlint: workflow
# syntax, expressions, runner labels, action inputs, and shellcheck on run: blocks.
# Standalone, not a stage of another workflow, so a broken workflow file elsewhere
# cannot stop this one from reporting. Follow this file's layout for changes; a new
# workflow or structural change needs a justification in the PR and code-owner review.
# Rule exceptions live in .github/actionlint.yaml (none yet: every finding fails).
# No paths filter: a required check a path filter never starts reports nothing.
name: actionlint

on:
  pull_request:
    branches: [main, dev, staging, release/*]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    # Fork PRs never run here: they get no workflow run without maintainer approval anyway, and skipping keeps the rule uniform.
    if: ${{ (!startsWith(github.event_name, 'pull_request') || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 2

      # A pinned, checksummed release tarball rather than upstream's
      # download-actionlint.bash, which resolves "latest" through the
      # unauthenticated GitHub API and fails opaquely when rate-limited.
      - name: Install actionlint 1.7.12
        env:
          ACTIONLINT_VERSION: "1.7.12"
          ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
        run: |
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          timeout 120 curl -fsSL --retry 5 --retry-all-errors -o "$RUNNER_TEMP/$tarball" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$tarball"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$tarball" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$tarball" -C "$RUNNER_TEMP" actionlint
        timeout-minutes: 3

      # shellcheck comes preinstalled on the ubuntu images; actionlint skips the
      # run: checks silently without it, so fail loudly instead.
      - name: Lint workflows
        run: |
          command -v shellcheck
          timeout 300 "$RUNNER_TEMP/actionlint" -color
        timeout-minutes: 6
    timeout-minutes: 12

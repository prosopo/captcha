# Regenerate visual-regression baseline snapshots and open a PR with the
# updated PNGs. Intended to be triggered manually after an intentional visual
# change to the captcha widget. Runs the same Docker/services setup as the
# main cypress workflow, but invokes cypress with `visualRegressionType=base`
# so the plugin writes baselines instead of comparing.

name: cypress-baselines

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Where the jobs run: auto (GH_RUNNER_MAP, else hosted), hosted or self-hosted. Fork PRs are always hosted."
        type: choice
        options: [auto, hosted, self-hosted]
        default: auto
      configs:
        description: "Comma-separated configs to regenerate (image,frictionless,pow,invisible). Default: all four."
        required: false
        default: "image,frictionless,pow,invisible"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
  GH_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NODE_OPTIONS: "--max-old-space-size=4096"
  NODE_ENV: "test"
  NODE_TLS_REJECT_UNAUTHORIZED: "0"

defaults:
  run:
    shell: bash

jobs:
  runner:
    # Hosted vs self-hosted for the jobs below (precedence in pick-runner.yml).
    # Public repo, so keep it out of GH_RUNNER_MAP: fork PRs are hosted regardless,
    # and standard hosted runners are free and unlimited on public repos, so the
    # fleet buys nothing. Only *larger* runners are billed; do not add size labels.
    # https://docs.github.com/en/billing/reference/actions-runner-pricing
    # workflow-lint: allow pr-types -- not skipped on drafts or forks: every job below reads runs-on from it
    uses: prosopo/github_actions/.github/workflows/pick-runner.yml@aa71b53c10f350e217c92ebe31beed8bd114a587  # main
    permissions:
      contents: read
      pull-requests: read
    with:
      actions-ref: aa71b53c10f350e217c92ebe31beed8bd114a587
      workflow: cypress-baselines
      runner: ${{ inputs.runner || 'auto' }}

  regenerate:
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.default) }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 20
        with:
          token: ${{ secrets.PROSOPONATOR_PAT }}
          submodules: "recursive"

      - name: Setup node and pnpm
        timeout-minutes: 30
        uses: prosopo/github_actions/.github/actions/setup-pnpm@0f332e76cb54093f6130fa9bdee5b54a9f870de9  # main
        with:
          node-version: '24.22.1'
          node-cache: 'pnpm'
          store-path: ''

      - name: Setup certs
        timeout-minutes: 5
        run: |
          ./setup_certs.sh
          ./install_cert.sh

      - name: Setup env
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          node .github/scripts/setup-env-files.mjs --https --verification-type local

      - run: timeout 29m pnpm exec turbo run build
        timeout-minutes: 30

      - name: Start the docker images
        timeout-minutes: 30
        run: |
          timeout 29m docker compose --file ./docker/docker-compose.test.yml up -d --remove-orphans --force-recreate --always-recreate-deps
          timeout 5m docker container ls
          sleep 10s

      - run: NODE_ENV="test" timeout 29m pnpm run setup
        timeout-minutes: 30

      - run: NODE_ENV="development" timeout 29m pnpm exec turbo run @prosopo/procaptcha-bundle#bundle
        timeout-minutes: 30

      - name: Regenerate image baselines
        timeout-minutes: 30
        if: contains(inputs.configs, 'image')
        run: |
          timeout 29m pnpm exec concurrently "pnpm run start:server" "pnpm run start:provider:admin" "pnpm run start:bundle" "pnpm run serve:bundle" "pnpm exec tsx ./demos/cypress-shared/scripts/wait-for-services.ts && pnpm --filter @prosopo/cypress-shared run cypress:baselines:image" --success "first" --kill-others  # no-timeout: quoted commands run under the outer timeout

      - name: Regenerate frictionless baselines
        timeout-minutes: 30
        if: contains(inputs.configs, 'frictionless')
        env:
          # Same as cypress.yml: without the detector pool, frictionless falls
          # back to PoW and the spec never sees the image challenge it expects.
          PROSOPO_DETECTOR_POOL_DIR: ${{ github.workspace }}/packages/provider/fixtures/detector-pool
        run: |
          timeout 29m pnpm exec concurrently "pnpm run start:server" "pnpm run start:provider:admin" "pnpm run start:bundle" "pnpm run serve:bundle" "pnpm exec tsx ./demos/cypress-shared/scripts/wait-for-services.ts && pnpm --filter @prosopo/cypress-shared run cypress:baselines:frictionless" --success "first" --kill-others  # no-timeout: quoted commands run under the outer timeout

      - name: Regenerate pow baselines
        timeout-minutes: 30
        if: contains(inputs.configs, 'pow')
        run: |
          timeout 29m pnpm exec concurrently "pnpm run start:server" "pnpm run start:provider:admin" "pnpm run start:bundle" "pnpm run serve:bundle" "pnpm exec tsx ./demos/cypress-shared/scripts/wait-for-services.ts && pnpm --filter @prosopo/cypress-shared run cypress:baselines:pow" --success "first" --kill-others  # no-timeout: quoted commands run under the outer timeout

      - name: Regenerate invisible baselines
        timeout-minutes: 30
        if: contains(inputs.configs, 'invisible')
        run: |
          timeout 29m pnpm exec concurrently "pnpm run start:server" "pnpm run start:provider:admin" "pnpm run start:bundle" "pnpm run serve:bundle" "pnpm exec tsx ./demos/cypress-shared/scripts/wait-for-services.ts && pnpm --filter @prosopo/cypress-shared run cypress:baselines:invisible" --success "first" --kill-others  # no-timeout: quoted commands run under the outer timeout

      - name: Container logs
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 3
        uses: prosopo/github_actions/.github/actions/container-logs@1b3257b005f4c59f97205f5e99c19d11e9d70a25  # main

      - run: timeout 4m docker compose --file ./docker/docker-compose.test.yml down
        timeout-minutes: 5
        if: always()

      - name: Write changeset for baseline regeneration
        timeout-minutes: 30
        run: |
          cat > ".changeset/regen-baselines-${{ github.run_id }}.md" <<'EOF'
          ---
          "@prosopo/cypress-shared": patch
          ---

          Regenerate visual snapshot baselines.
          EOF

      - name: Open PR with regenerated baselines
        timeout-minutes: 30
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.PROSOPONATOR_PAT }}
          add-paths: |
            demos/cypress-shared/cypress/snapshots/baseline/**
            .changeset/regen-baselines-*.md
          commit-message: "chore(cypress): regenerate visual snapshot baselines"
          title: "chore(cypress): regenerate visual snapshot baselines"
          body: |
            Automated baseline regeneration via the `cypress-baselines` workflow.

            Configs regenerated: `${{ inputs.configs }}`
            Triggered by: @${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Review the PNG changes carefully — each one represents an intentional visual change to the captcha widget.
          branch: chore/regenerate-cypress-baselines-${{ github.run_id }}
          delete-branch: true
          base: ${{ github.ref_name }}

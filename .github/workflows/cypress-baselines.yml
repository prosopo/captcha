# Regenerate visual-regression baseline snapshots and open a PR with the
# updated PNGs. Intended to be triggered manually after an intentional visual
# change to the captcha widget. Runs the same Docker/services setup as the
# main cypress workflow, but invokes cypress with `visualRegressionType=base`
# so the plugin writes baselines instead of comparing.

name: cypress-baselines

on:
  workflow_dispatch:
    inputs:
      configs:
        description: "Comma-separated configs to regenerate (image,frictionless,pow,invisible). Default: all four."
        required: false
        default: "image,frictionless,pow,invisible"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
  GH_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NODE_OPTIONS: "--max-old-space-size=4096"
  NODE_ENV: "test"
  NODE_TLS_REJECT_UNAUTHORIZED: "0"

defaults:
  run:
    shell: bash

jobs:
  regenerate:
    # Hosted, deliberately, and not routed through `vars.GH_RUNNER` like the
    # other repos: this repository is public, so a fork PR would run on the
    # self-hosted fleet -- executing arbitrary contributor code on hardware we
    # own, where it can also persist and poison later trusted jobs. Nothing is
    # given up by staying hosted: standard GitHub-hosted runners are free and
    # unlimited on public repos, macOS and Windows included. Only *larger*
    # runners are billed, so do not "upgrade" a job to one.
    # https://docs.github.com/en/billing/reference/actions-runner-pricing
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 20
        with:
          token: ${{ secrets.PROSOPONATOR_PAT }}
          submodules: "recursive"

      - name: Setup node and pnpm
        timeout-minutes: 20
        uses: prosopo/github_actions/.github/actions/setup-pnpm@0f332e76cb54093f6130fa9bdee5b54a9f870de9  # main
        with:
          node-version: '24.22.1'
          node-cache: 'pnpm'
          store-path: ''

      - name: Setup certs
        timeout-minutes: 5
        run: |
          ./setup_certs.sh
          ./install_cert.sh

      - name: Setup env
        timeout-minutes: 5
        run: |
          set -euxo pipefail
          cp demos/client-example-server/env.development demos/client-example-server/.env.test
          cp demos/client-bundle-example/env.development demos/client-bundle-example/.env.test
          cp dev/scripts/env.test .env.test
          cp dev/scripts/env.test dev/scripts/.env.test
          cp dev/scripts/env.test packages/cli/.env.test
          cp dev/scripts/env.test packages/procaptcha-bundle/.env.test
          sed -i 's|http://localhost|https://localhost|g' demos/client-bundle-example/.env.test
          sed -i 's|http://localhost|https://localhost|g' .env.test
          sed -i 's|http://localhost|https://localhost|g' dev/scripts/.env.test
          sed -i 's|http://localhost|https://localhost|g' packages/cli/.env.test
          sed -i 's|http://localhost|https://localhost|g' packages/procaptcha-bundle/.env.test
          sed -i '/^PROSOPO_VERIFICATION_TYPE=/s/=.*/=local/' demos/client-example-server/.env.test

      - run: pnpm exec turbo run build
        timeout-minutes: 10

      - name: Start the docker images
        timeout-minutes: 5
        run: |
          docker compose --file ./docker/docker-compose.test.yml up -d --remove-orphans --force-recreate --always-recreate-deps
          docker container ls
          sleep 10s

      - run: NODE_ENV="test" pnpm run setup
        timeout-minutes: 5

      - run: NODE_ENV="development" pnpm exec turbo run @prosopo/procaptcha-bundle#bundle
        timeout-minutes: 5

      - name: Regenerate image baselines
        timeout-minutes: 5
        if: contains(inputs.configs, 'image')
        run: |
          pnpm exec concurrently "pnpm run start:server" "pnpm run start:provider:admin" "pnpm run start:bundle" "pnpm run serve:bundle" "pnpm exec tsx ./demos/cypress-shared/scripts/wait-for-services.ts && pnpm --filter @prosopo/cypress-shared run cypress:baselines:image" --success "first" --kill-others

      - name: Regenerate frictionless baselines
        timeout-minutes: 5
        if: contains(inputs.configs, 'frictionless')
        env:
          # Same as cypress.yml: without the detector pool, frictionless falls
          # back to PoW and the spec never sees the image challenge it expects.
          PROSOPO_DETECTOR_POOL_DIR: ${{ github.workspace }}/packages/provider/fixtures/detector-pool
        run: |
          pnpm exec concurrently "pnpm run start:server" "pnpm run start:provider:admin" "pnpm run start:bundle" "pnpm run serve:bundle" "pnpm exec tsx ./demos/cypress-shared/scripts/wait-for-services.ts && pnpm --filter @prosopo/cypress-shared run cypress:baselines:frictionless" --success "first" --kill-others

      - name: Regenerate pow baselines
        timeout-minutes: 5
        if: contains(inputs.configs, 'pow')
        run: |
          pnpm exec concurrently "pnpm run start:server" "pnpm run start:provider:admin" "pnpm run start:bundle" "pnpm run serve:bundle" "pnpm exec tsx ./demos/cypress-shared/scripts/wait-for-services.ts && pnpm --filter @prosopo/cypress-shared run cypress:baselines:pow" --success "first" --kill-others

      - name: Regenerate invisible baselines
        timeout-minutes: 5
        if: contains(inputs.configs, 'invisible')
        run: |
          pnpm exec concurrently "pnpm run start:server" "pnpm run start:provider:admin" "pnpm run start:bundle" "pnpm run serve:bundle" "pnpm exec tsx ./demos/cypress-shared/scripts/wait-for-services.ts && pnpm --filter @prosopo/cypress-shared run cypress:baselines:invisible" --success "first" --kill-others

      - run: docker compose --file ./docker/docker-compose.test.yml down
        timeout-minutes: 5
        if: always()

      - name: Write changeset for baseline regeneration
        timeout-minutes: 5
        run: |
          cat > ".changeset/regen-baselines-${{ github.run_id }}.md" <<'EOF'
          ---
          "@prosopo/cypress-shared": patch
          ---

          Regenerate visual snapshot baselines.
          EOF

      - name: Open PR with regenerated baselines
        timeout-minutes: 5
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1  # v8.1.1
        with:
          token: ${{ secrets.PROSOPONATOR_PAT }}
          add-paths: |
            demos/cypress-shared/cypress/snapshots/baseline/**
            .changeset/regen-baselines-*.md
          commit-message: "chore(cypress): regenerate visual snapshot baselines"
          title: "chore(cypress): regenerate visual snapshot baselines"
          body: |
            Automated baseline regeneration via the `cypress-baselines` workflow.

            Configs regenerated: `${{ inputs.configs }}`
            Triggered by: @${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Review the PNG changes carefully — each one represents an intentional visual change to the captcha widget.
          branch: chore/regenerate-cypress-baselines-${{ github.run_id }}
          delete-branch: true
          base: ${{ github.ref_name }}

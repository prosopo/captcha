# Build and publish the provider image

name: provider_image

on:
  pull_request:
    branches: [main, dev, staging, release/*]
    types:
      - opened # when a PR is opened
      - synchronize # when a PR is pushed to
      - reopened # when a PR is reopened
      - ready_for_review # when a PR is marked as ready for review (e.g. taken off draft mode)
      - converted_to_draft
  workflow_dispatch:
    inputs:
      runner:
        description: "Where the jobs run: auto (GH_RUNNER_MAP, else hosted), hosted or self-hosted. Fork PRs are always hosted."
        type: choice
        options: [auto, hosted, self-hosted]
        default: auto

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.runner }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
  GH_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NODE_OPTIONS: "--max-old-space-size=4096"
  NODE_ENV: "test"

defaults:
  run:
    shell: bash

# Fork guard on every job: a PR from a fork never runs here. Jobs hold
# secrets and write shared caches that later trusted jobs restore, so fork
# code must not run in them (https://github.com/prosopo/gh-runner).
jobs:
  runner:
    # Hosted vs self-hosted for the jobs below (precedence in pick-runner.yml).
    # Public repo, so keep it out of GH_RUNNER_MAP: fork PRs are hosted regardless,
    # and standard hosted runners are free and unlimited on public repos, so the
    # fleet buys nothing. Only *larger* runners are billed; do not add size labels.
    # https://docs.github.com/en/billing/reference/actions-runner-pricing
    # workflow-lint: allow pr-types -- not skipped on drafts or forks: every job below reads runs-on from it
    uses: prosopo/github_actions/.github/workflows/pick-runner.yml@aa71b53c10f350e217c92ebe31beed8bd114a587  # main
    permissions:
      contents: read
      pull-requests: read
    with:
      actions-ref: aa71b53c10f350e217c92ebe31beed8bd114a587
      workflow: provider_image
      runner: ${{ inputs.runner || 'auto' }}

  check:
    name: provider-image
    timeout-minutes: 60
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.default) }}
    if: ${{ (github.event.pull_request.draft != true) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Print contexts
        timeout-minutes: 5
        uses: prosopo/github_actions/.github/actions/print_contexts@0f332e76cb54093f6130fa9bdee5b54a9f870de9  # main
        with:
          INPUTS_CONTEXT: ${{ toJson(inputs) }}
          NEEDS_CONTEXT: ${{ toJson(needs) }}
          VARS_CONTEXT: ${{ toJson(vars) }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          token: ${{ secrets.PROSOPONATOR_PAT }}
          submodules: "recursive"

      - name: Setup node and pnpm
        timeout-minutes: 30
        uses: prosopo/github_actions/.github/actions/setup-pnpm@0f332e76cb54093f6130fa9bdee5b54a9f870de9  # main
        with:
          node-version-file: .nvmrc
          node-cache: 'pnpm'
          store-path: ''

      - name: env
        timeout-minutes: 5
        run: |
          node .github/scripts/setup-env-files.mjs --mode production --only .,packages/cli

      - env:
          NODE_ENV: "production"
        run: timeout 29m pnpm exec turbo run @prosopo/cli#build
        timeout-minutes: 30
      - env:
          NODE_ENV: "production"
        run: timeout 29m pnpm exec turbo run @prosopo/cli#bundle
        timeout-minutes: 30

      - name: Set up Docker Buildx
        timeout-minutes: 5
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # We cannot create the images in a single step because the output of buildx is not compatible with
      # `docker load`. https://stackoverflow.com/a/72952846/1178971

      # create the provider image for AMD64
      - name: Build the Provider Container
        timeout-minutes: 30
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{github.workspace}}
          file: ${{github.workspace}}/packages/cli/Dockerfile
          platforms: linux/amd64
          push: false
          tags: prosopo/provider:dev
          outputs: type=docker,dest=provider-amd64.tar

      # load the AMD64 image
      - name: Load the Provider Container
        timeout-minutes: 30
        run: timeout 29m docker load -i provider-amd64.tar

      # Generate a mnemonic for the provider image
      - name: Generate mnemonic and add to env file
        timeout-minutes: 5
        env:
          PROSOPO_ROOT_DIR: ${{ github.workspace }}
          NODE_ENV: production
        run: |
          timeout 4m pnpm exec tsx dev/scripts/src/scripts/generateMnemonic.ts --env

      # Check that the version command works when running the bundle in the provider image
      - name: Check provider bundle runs
        timeout-minutes: 30
        run: |
          set -euxo pipefail # stop on errors, print commands, fail on pipe fails

          # Run container and capture exit code
          # The runtime image is distroless: no shell, no npx. ENTRYPOINT is
          # node, so the bundle path and its args are passed as argv, and
          # NODE_ENV comes in as a real env var rather than a shell prefix.
          CONTAINER="$(timeout 29m docker run -d -e NODE_ENV=production -v "./.env.production:/usr/src/app/.env.production" prosopo/provider:dev /usr/src/app/provider.cli.bundle.js version)"
          
          # Wait for container to complete
          sleep 20s
          
          # Get container exit code
          EXIT_CODE="$(timeout 5m docker wait "$CONTAINER" || echo "timeout")"
          
          # Capture logs
          timeout 5m docker logs "$CONTAINER" > provider.log 2>&1
          cat provider.log
          
          # Check if container exited successfully
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Container failed with exit code: $EXIT_CODE"
            echo "Checking for common errors..."
            
            if grep -q "Could not resolve" provider.log; then
              echo "ERROR: Missing dependency detected in bundle"
              exit 1
            else
              echo "ERROR: Container failed for unknown reason"
              exit 1
            fi
          fi
          
          # Verify version output is present
          if ! grep -qE "\"version\":\".*\"" provider.log; then
            echo "ERROR: Version command did not produce expected output"
            exit 1
          fi
          
          echo "Provider bundle test passed successfully"

      - name: Container logs
        if: ${{ failure() || cancelled() }}
        timeout-minutes: 3
        uses: prosopo/github_actions/.github/actions/container-logs@1b3257b005f4c59f97205f5e99c19d11e9d70a25  # main

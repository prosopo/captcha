# Build and publish the provider image

name: provider_image

on:
  pull_request:
    branches: [main, dev, staging, release/*]
    types:
      - opened # when a PR is opened
      - synchronize # when a PR is pushed to
      - reopened # when a PR is reopened
      - ready_for_review # when a PR is marked as ready for review (e.g. taken off draft mode)
      - converted_to_draft
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GITHUB_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
  GH_TOKEN: ${{ secrets.PROSOPONATOR_PAT }}
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NODE_OPTIONS: "--max-old-space-size=4096"
  NODE_ENV: "test"

defaults:
  run:
    shell: bash

# Fork guard on every job: a PR from a fork never runs here. Jobs hold
# secrets and write shared caches that later trusted jobs restore, so fork
# code must not run in them (https://github.com/prosopo/gh-runner).
jobs:
  check:
    name: provider-image
    timeout-minutes: 15
    # Hosted, deliberately, and not routed through `vars.GH_RUNNER` like the
    # other repos: this repository is public, so a fork PR would run on the
    # self-hosted fleet -- executing arbitrary contributor code on hardware we
    # own, where it can also persist and poison later trusted jobs. Nothing is
    # given up by staying hosted: standard GitHub-hosted runners are free and
    # unlimited on public repos, macOS and Windows included. Only *larger*
    # runners are billed, so do not "upgrade" a job to one.
    # https://docs.github.com/en/billing/reference/actions-runner-pricing
    runs-on: ubuntu-latest
    if: ${{ (github.event.pull_request.draft != true) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    steps:
      - name: Print contexts
        timeout-minutes: 5
        uses: prosopo/github_actions/.github/actions/print_contexts@0f332e76cb54093f6130fa9bdee5b54a9f870de9  # main
        with:
          INPUTS_CONTEXT: ${{ toJson(inputs) }}
          NEEDS_CONTEXT: ${{ toJson(needs) }}
          VARS_CONTEXT: ${{ toJson(vars) }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 5
        with:
          token: ${{ secrets.PROSOPONATOR_PAT }}
          submodules: "recursive"

      - name: Setup node and pnpm
        timeout-minutes: 5
        uses: prosopo/github_actions/.github/actions/setup-pnpm@0f332e76cb54093f6130fa9bdee5b54a9f870de9  # main
        with:
          node-version: '24.22.1'
          node-cache: 'pnpm'
          store-path: ''

      - name: env
        timeout-minutes: 5
        run: |
          # Copy the .env.production from the dev script to the cli folder and root folder
          cp ./dev/scripts/env.production ./packages/cli/.env.production
          cp ./dev/scripts/env.production ./.env.production
          
          # Append the development PROVIDER_MNEMONIC from env.development to the .env.production file
          grep -PoIe "PROSOPO_PROVIDER_MNEMONIC.*" ./dev/scripts/env.development >> .env.production

      - run: NODE_ENV="production" pnpm exec turbo run @prosopo/cli#build
        timeout-minutes: 10
      - run: NODE_ENV="production" pnpm exec turbo run @prosopo/cli#bundle
        timeout-minutes: 5

      - name: Set up Docker Buildx
        timeout-minutes: 5
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      # We cannot create the images in a single step because the output of buildx is not compatible with
      # `docker load`. https://stackoverflow.com/a/72952846/1178971

      # create the provider image for AMD64
      - name: Build the Provider Container
        timeout-minutes: 5
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{github.workspace}}
          file: ${{github.workspace}}/packages/cli/Dockerfile
          platforms: linux/amd64
          push: false
          tags: prosopo/provider:dev
          outputs: type=docker,dest=provider-amd64.tar

      # load the AMD64 image
      - name: Load the Provider Container
        timeout-minutes: 5
        run: docker load -i provider-amd64.tar

      # Generate a mnemonic for the provider image
      - name: Generate mnemonic and add to env file
        timeout-minutes: 5
        run: |
          PROSOPO_ROOT_DIR=$(pwd) NODE_ENV="production" pnpm exec tsx dev/scripts/src/scripts/generateMnemonic.ts --env

      # Check that the version command works when running the bundle in the provider image
      - name: Check provider bundle runs
        timeout-minutes: 5
        run: |
          set -euxo pipefail # stop on errors, print commands, fail on pipe fails

          # Run container and capture exit code
          # The runtime image is distroless: no shell, no npx. ENTRYPOINT is
          # node, so the bundle path and its args are passed as argv, and
          # NODE_ENV comes in as a real env var rather than a shell prefix.
          CONTAINER="$(docker run -d -e NODE_ENV=production -v "./.env.production:/usr/src/app/.env.production" prosopo/provider:dev /usr/src/app/provider.cli.bundle.js version)"
          
          # Wait for container to complete
          sleep 20s
          
          # Get container exit code
          EXIT_CODE="$(docker wait "$CONTAINER" || echo "timeout")"
          
          # Capture logs
          docker logs "$CONTAINER" > provider.log 2>&1
          cat provider.log
          
          # Check if container exited successfully
          if [ "$EXIT_CODE" != "0" ]; then
            echo "Container failed with exit code: $EXIT_CODE"
            echo "Checking for common errors..."
            
            if grep -q "Could not resolve" provider.log; then
              echo "ERROR: Missing dependency detected in bundle"
              exit 1
            else
              echo "ERROR: Container failed for unknown reason"
              exit 1
            fi
          fi
          
          # Verify version output is present
          if ! grep -qE "\"version\":\".*\"" provider.log; then
            echo "ERROR: Version command did not produce expected output"
            exit 1
          fi
          
          echo "Provider bundle test passed successfully"

# Opens the release PR from pending changesets, so releases are reviewed like any change.
# Shared actions: https://github.com/prosopo/github_actions. Runners: https://github.com/prosopo/gh-runner.
name: create_release_pr

on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Where the jobs run: auto (GH_RUNNER_MAP, else hosted), hosted or self-hosted. Fork PRs are always hosted."
        type: choice
        options: [auto, hosted, self-hosted]
        default: auto

permissions:
  contents: write
  pull-requests: write

defaults:
  run:
    shell: bash

env:
  # Dependency debuginfo dominates a dev build and nothing here steps through
  # third-party code; incremental state is worthless on a cold CI runner.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  BRANCH_PROTECTION_DISABLED: 'true'
  NODE_ENV: "production"

jobs:
  runner:
    # Hosted vs self-hosted for the jobs below (precedence in pick-runner.yml).
    # Public repo, so keep it out of GH_RUNNER_MAP: fork PRs are hosted regardless,
    # and standard hosted runners are free and unlimited on public repos, so the
    # fleet buys nothing. Only *larger* runners are billed; do not add size labels.
    # https://docs.github.com/en/billing/reference/actions-runner-pricing
    # workflow-lint: allow pr-types -- not skipped on drafts or forks: every job below reads runs-on from it
    uses: prosopo/github_actions/.github/workflows/pick-runner.yml@aa71b53c10f350e217c92ebe31beed8bd114a587  # main
    permissions:
      contents: read
      pull-requests: read
    with:
      actions-ref: aa71b53c10f350e217c92ebe31beed8bd114a587
      workflow: create_release_pr
      runner: ${{ inputs.runner || 'auto' }}

  create-pr:
    name: Create Release PR
    timeout-minutes: 60
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.default) }}
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - name: Get token for gh app
        timeout-minutes: 5
        id: app_token
        uses: prosopo/github_actions/.github/actions/app-token@0f332e76cb54093f6130fa9bdee5b54a9f870de9  # main
        with:
          application-id: ${{ vars.PROSOPONATOR_APP_ID }}
          application-private-key: ${{ secrets.PROSOPONATOR_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 15
        with:
          submodules: 'recursive'
          token: ${{ steps.app_token.outputs.token }}
          fetch-depth: 0

      - name: Setup node and pnpm
        timeout-minutes: 30
        uses: prosopo/github_actions/.github/actions/setup-pnpm@0f332e76cb54093f6130fa9bdee5b54a9f870de9  # main
        with:
          node-version: '24.22.1'
          node-cache: 'pnpm'
          store-path: ''
          run-install: 'false'

      - name: Setup npm registry
        timeout-minutes: 30
        run: |
          # Literal ${NPM_TOKEN}: npm expands it from the job env at use time, so the token never lands on disk.
          # shellcheck disable=SC2016
          echo '//registry.npmjs.org/:_authToken=${NPM_TOKEN}' >> ~/.npmrc

      - name: Git config
        timeout-minutes: 5
        run: |
          git config user.name "prosoponator[bot]"
          git config user.email "dev@prosopo.io"

      - run: timeout 29m pnpm install --frozen-lockfile --ignore-scripts --prefer-offline
        timeout-minutes: 30

      - name: Detect changesets
        timeout-minutes: 5
        id: detect
        run: |
          if find .changeset -name "*.md" ! -name "README.md" | grep -q . ; then
            echo "Found changesets"
            echo "has_changesets=true" >> "$GITHUB_OUTPUT"
          else
            echo "No changesets found"
            echo "has_changesets=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Exit if no changesets
        timeout-minutes: 5
        if: steps.detect.outputs.has_changesets == 'false'
        run: |
          echo "No changesets found, nothing to release"
          exit 0

      - name: Version bump
        timeout-minutes: 30
        if: steps.detect.outputs.has_changesets == 'true'
        run: |
          timeout 29m pnpm exec changeset version --verbose

          timeout 29m pnpm install --lockfile-only --ignore-scripts
          
          # Set the root package.json version to match @prosopo/cli. The provider
          # image tag now comes from packages/cli's own version, so there is no
          # wrapper package left to keep in step.
          root_version=$(jq -r .version packages/cli/package.json)
          echo "root_version=$root_version" >> "$GITHUB_ENV"
          echo "Setting versions to $root_version"
          
          timeout 29m pnpm pkg set version="$root_version"
          
          git add -u .

      - run: timeout 29m pnpm install --frozen-lockfile --ignore-scripts --prefer-offline
        timeout-minutes: 30

      - name: Build packages
        timeout-minutes: 30
        run: |
          echo "Building all packages"
          timeout 29m pnpm run build:all

      - name: lint-fix
        timeout-minutes: 5
        run: |
          timeout 4m pnpm run lint-fix
          git add -u .

      - name: Create release branch and PR
        timeout-minutes: 5
        if: steps.detect.outputs.has_changesets == 'true'
        env:
          GITHUB_TOKEN: ${{ steps.app_token.outputs.token }}
        run: |
          branch_name="release/${{ env.root_version }}"
          
          git checkout -b "$branch_name"
          git commit -m "chore: version bump v${{ env.root_version }}"
          timeout 4m git push --set-upstream origin "$branch_name"
          
          timeout 4m gh pr create \
            --title "Release v${{ env.root_version }}" \
            --body "Automated release PR for version ${{ env.root_version }}" \
            --base main \
            --head "$branch_name"


# Fails a PR that adds a package.json whose name is outside the @prosopo/ scope.
# See .github/scripts/check-package-scope.mjs. Reads tracked files only: no install.
# No paths filter: required-check waits on every check, and a workflow a path
# filter never starts would report nothing.
name: package-scope

on:
  pull_request:
    branches: [main, dev, staging, release/*]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:
    inputs:
      runner:
        description: "Where the jobs run: auto (GH_RUNNER_MAP, else hosted), hosted or self-hosted. Fork PRs are always hosted."
        type: choice
        options: [auto, hosted, self-hosted]
        default: auto

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash --noprofile --norc -euo pipefail {0}

jobs:
  runner:
    # Hosted vs self-hosted for the jobs below (precedence in pick-runner.yml).
    # Public repo, so keep it out of GH_RUNNER_MAP: fork PRs are hosted regardless,
    # and standard hosted runners are free and unlimited on public repos, so the
    # fleet buys nothing. Only *larger* runners are billed; do not add size labels.
    # https://docs.github.com/en/billing/reference/actions-runner-pricing
    # workflow-lint: allow pr-types -- not skipped on drafts or forks: every job below reads runs-on from it
    uses: prosopo/github_actions/.github/workflows/pick-runner.yml@aa71b53c10f350e217c92ebe31beed8bd114a587  # main
    permissions:
      contents: read
      pull-requests: read
    with:
      actions-ref: aa71b53c10f350e217c92ebe31beed8bd114a587
      workflow: package-scope
      runner: ${{ inputs.runner || 'auto' }}

  check:
    name: package-scope
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.default) }}
    # Fork PRs never run here: self-hosted runners keep caches between jobs, which a fork could poison.
    if: ${{ (!startsWith(github.event_name, 'pull_request') || github.event.pull_request.head.repo.full_name == github.repository) && (github.event_name != 'pull_request' || github.event.pull_request.draft != true) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
        timeout-minutes: 5

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version-file: .nvmrc
        timeout-minutes: 5

      - name: Check script tests
        run: timeout 120 node --test .github/scripts/check-package-scope.test.mjs
        timeout-minutes: 5

      - name: Check every package name is @prosopo/-scoped
        run: timeout 60 node .github/scripts/check-package-scope.mjs
        timeout-minutes: 5
    timeout-minutes: 10

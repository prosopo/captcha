# The napi crates carry Rust unit tests that `pnpm run test:all` never runs:
# turbo only drives the JS suites. Each crate is also held to `cargo fmt
# --check` and `cargo clippy -D warnings`, which nothing else runs. Its own
# workflow, not a tests.yml job, so a
# Rust failure is reported on its own and does not wait for the full JS build,
# and so it runs only when a crate can have changed.

# Shared actions: https://github.com/prosopo/github_actions. Runners: https://github.com/prosopo/gh-runner.
name: cargo-test

on:
  pull_request:
    branches: [main, dev, staging, release/*]
    # Safe against the "required check never reports" trap: required-check.yml
    # publishes `check` with no path filter and waits on every check run, so a
    # PR touching neither path still gets a `check`.
    paths:
      - 'packages/native-*/**'
      - '.github/workflows/cargo-test.yml'
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft
  workflow_dispatch:
    inputs:
      runner:
        description: "Where the jobs run: auto (GH_RUNNER_MAP, else hosted), hosted or self-hosted. Fork PRs are always hosted."
        type: choice
        options: [auto, hosted, self-hosted]
        default: auto

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ inputs.runner }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

defaults:
  run:
    shell: bash

# Fork guard on every job: a PR from a fork never runs here. Jobs hold
# secrets and write shared caches that later trusted jobs restore, so fork
# code must not run in them (https://github.com/prosopo/gh-runner).
jobs:
  runner:
    # Hosted vs self-hosted for the jobs below (precedence in pick-runner.yml).
    # Public repo, so keep it out of GH_RUNNER_MAP: fork PRs are hosted regardless,
    # and standard hosted runners are free and unlimited on public repos, so the
    # fleet buys nothing. Only *larger* runners are billed; do not add size labels.
    # https://docs.github.com/en/billing/reference/actions-runner-pricing
    # workflow-lint: allow pr-types -- not skipped on drafts or forks: every job below reads runs-on from it
    uses: prosopo/github_actions/.github/workflows/pick-runner.yml@aa71b53c10f350e217c92ebe31beed8bd114a587  # main
    permissions:
      contents: read
      pull-requests: read
    with:
      actions-ref: aa71b53c10f350e217c92ebe31beed8bd114a587
      workflow: cargo-test
      runner: ${{ inputs.runner || 'auto' }}

  cargo-test:
    name: cargo test (${{ matrix.crate }})
    timeout-minutes: 60
    # Hosted for the same reason as tests.yml: this repository is public.
    needs: runner
    runs-on: ${{ fromJSON(needs.runner.outputs.default) }}
    if: ${{ (github.event.pull_request.draft != true) && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    strategy:
      fail-fast: false
      matrix:
        # Independent crates, each with its own lockfile. A new
        # packages/native-* crate is not tested until it is listed here.
        crate:
          [packages/native-ja4, packages/native-merkle, packages/native-puzzle]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        timeout-minutes: 60
        with:
          submodules: false

      - name: Record the rustc version for the cache key
        timeout-minutes: 60
        id: rustc-version
        run: |
          release=$(rustc -vV | sed -n 's/^release: //p')
          commit=$(rustc -vV | sed -n 's/^commit-hash: //p')
          if [ -z "$release" ]; then
            echo "::error::could not read release from rustc -vV"; exit 1
          fi
          echo "version=${release}${commit:+-${commit:0:9}}" >> "$GITHUB_OUTPUT"

      # The compiler goes in prefix-key, not just key: rust-cache derives its
      # restore-keys from the prefix, so a version left outside it can restore a
      # target/ built by another rustc, which cargo rejects with E0514.
      - name: Cache cargo
        timeout-minutes: 60
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6  # v2.9.2
        with:
          workspaces: ${{ matrix.crate }}
          prefix-key: v0-rust-${{ steps.rustc-version.outputs.version }}

      # Ahead of clippy and test: needs no build, so a formatting slip fails fast.
      - name: cargo fmt --check
        timeout-minutes: 5
        working-directory: ${{ matrix.crate }}
        run: timeout 4m cargo fmt --check

      # --all-targets lints the #[cfg(test)] code too. Shares target/ with the
      # test build below, so the dependencies compile once.
      - name: cargo clippy
        timeout-minutes: 30
        working-directory: ${{ matrix.crate }}
        run: timeout 25m cargo clippy --locked --all-targets -- -D warnings

      # Debug, not --release: the release profile's fat LTO and single codegen
      # unit are for the shipped addon, and only slow a test build down. The
      # dependencies are still optimised via profile.dev.package."*".
      - name: cargo test
        timeout-minutes: 60
        working-directory: ${{ matrix.crate }}
        run: timeout 30m cargo test --locked

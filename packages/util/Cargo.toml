[package]
name = "prosopo-util"
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "rust/lib.rs"

[dependencies]
base64 = "0.22"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
num-bigint = "0.4"
num-traits = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tokio = { version = "1.40", features = ["fs", "io-util"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2.5"

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
tempfile = "3.10"
tokio = { version = "1.40", features = ["fs", "io-util", "macros", "rt"] }

[package]
name = "prosopo-logger"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "rust/lib.rs"

[dependencies]
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }

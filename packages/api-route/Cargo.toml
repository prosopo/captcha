[package]
name = "prosopo-api-route"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "rust/lib.rs"

[dependencies]
indexmap = "2.14"
prosopo-logger = { path = "../logger" }
regex = "1.13"
ryu-js = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
url = "2.5"

[dev-dependencies]
tokio = { version = "1.54", features = ["macros", "rt"] }

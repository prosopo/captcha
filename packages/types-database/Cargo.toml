[package]
name = "prosopo-types-database"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "rust/lib.rs"

[dependencies]
bson = { version = "3.1", features = ["serde"] }
prosopo-api-route = { path = "../api-route" }
prosopo-locale = { path = "../locale" }
prosopo-logger = { path = "../logger" }
prosopo-types = { path = "../types" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }

[dev-dependencies]
bson = { version = "3.1", features = ["serde", "serde_json-1"] }
hex = "0.4"

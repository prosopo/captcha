[package]
name = "prosopo-icon-order-assets"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "rust/lib.rs"

[dependencies]
libm = "0.2"
prosopo-puzzle-assets = { path = "../puzzle-assets" }
resvg = { version = "0.48", default-features = false }

[dev-dependencies]
base64 = "0.22"
hex = "0.4"
png = "0.17"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip"] }
sha2 = "0.10"
webp = { version = "0.3", default-features = false }

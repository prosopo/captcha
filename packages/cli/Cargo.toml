[package]
name = "prosopo-cli"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "rust/lib.rs"

[[bin]]
name = "prosopo-provider"
path = "rust/main.rs"

[[test]]
name = "binary"
path = "rust/tests_binary.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.5", features = ["derive"] }
prosopo-dotenv = { path = "../dotenv" }
prosopo-env = { path = "../env" }
prosopo-keyring = { path = "../keyring" }
prosopo-provider = { path = "../provider" }
prosopo-util-crypto = { path = "../util-crypto" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
prosopo-api-route = { path = "../api-route" }
prosopo-common = { path = "../common" }
prosopo-logger = { path = "../logger" }
prosopo-types = { path = "../types" }
prosopo-util = { path = "../util" }
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }

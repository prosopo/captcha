[package]
name = "prosopo-cli"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "rust/lib.rs"

[[bin]]
name = "prosopo-provider"
path = "rust/main.rs"

[[test]]
name = "binary"
path = "rust/tests_binary.rs"

[[test]]
name = "live"
path = "rust/tests_live.rs"

[dependencies]
bson = { version = "3.1", features = ["serde"] }
prosopo-datasets = { path = "../datasets" }
prosopo-api = { path = "../api" }
prosopo-load-balancer = { path = "../load-balancer" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
clap = { version = "4.5", features = ["derive"] }
prosopo-api-router = { path = "../api-express-router" }
prosopo-database = { path = "../database" }
prosopo-dotenv = { path = "../dotenv" }
prosopo-env = { path = "../env" }
prosopo-keyring = { path = "../keyring" }
prosopo-locale = { path = "../locale" }
prosopo-provider = { path = "../provider" }
prosopo-user-access-policy = { path = "../user-access-policy" }
prosopo-util-crypto = { path = "../util-crypto" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
prosopo-api-route = { path = "../api-route" }
prosopo-common = { path = "../common" }
prosopo-logger = { path = "../logger" }
prosopo-types = { path = "../types" }
prosopo-util = { path = "../util" }
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }

[dev-dependencies]
tempfile = "3.10"
bson = { version = "3.1", features = ["serde", "serde_json-1"] }
mongodb = { version = "3.9", default-features = false, features = ["compat-3-3-0", "bson-3", "rustls-tls", "dns-resolver"] }
redis = { version = "1.7", default-features = false, features = ["aio", "tokio-comp"] }
uuid = "1"
base64 = "0.22"
regex = "1"
prosopo-provider = { path = "../provider", features = ["testing"] }

[package]
name = "prosopo-datasets-fs"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "rust/lib.rs"

[[bin]]
name = "datasets-fs"
path = "rust/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libloading = "0.9"
prosopo-api-route = { path = "../api-route" }
prosopo-common = { path = "../common" }
prosopo-logger = { path = "../logger" }
prosopo-types = { path = "../types" }
prosopo-util = { path = "../util" }
prosopo-util-crypto = { path = "../util-crypto" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }

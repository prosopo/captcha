[package]
name = "prosopo-types"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "rust/lib.rs"

[dependencies]
prosopo-api-route = { path = "../api-route" }
prosopo-util-crypto = { path = "../util-crypto" }
indexmap = { version = "2.14", features = ["serde"] }
regex = "1.13"
regress = "0.12"
unicode-ident = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[package]
name = "prosopo-ipinfo"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "rust/lib.rs"

[dependencies]
maxminddb = "0.26"
prosopo-logger = { path = "../logger" }
prosopo-types = { path = "../types" }
regex = "1.13"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
tokio = { version = "1", features = ["time"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }

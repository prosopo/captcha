[package]
name = "prosopo-provider"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "rust/lib.rs"

[dependencies]
bson = { version = "3.1", features = ["serde"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
bytes = "1"
flate2 = "1.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
hickory-resolver = { version = "0.26", default-features = false, features = ["tokio"] }
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
indexmap = "2"
num-bigint = "0.4"
num-traits = "0.2"
prosopo-api-route = { path = "../api-route" }
prosopo-api-router = { path = "../api-express-router" }
prosopo-captcha-severity = { path = "../captcha-severity" }
prosopo-ja4 = "0.1"
prosopo-locale = { path = "../locale" }
prosopo-user-access-policy = { path = "../user-access-policy" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tower = { version = "0.5", features = ["util"] }
url = "2.5"
uuid = { version = "1", features = ["v4"] }
prosopo-common = { path = "../common" }
prosopo-database = { path = "../database" }
prosopo-ipinfo = { path = "../ipinfo" }
prosopo-logger = { path = "../logger" }
prosopo-types = { path = "../types" }
prosopo-util = { path = "../util" }
prosopo-util-crypto = { path = "../util-crypto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["io-util", "net", "rt", "sync", "time"] }

[features]
# The socket replay helpers, for the equivalence tests of crates that build the app.
testing = []

[dev-dependencies]
bson = { version = "3.1", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[package]
name = "prosopo-provider"
version.workspace = true
edition = "2021"
license = "Apache-2.0"
publish = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lib]
path = "rust/lib.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
base64 = "0.22"
bytes = "1"
flate2 = "1.1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1"
hyper = { version = "1", features = ["http1", "server"] }
indexmap = "2"
prosopo-api-router = { path = "../api-express-router" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha1 = "0.11"
url = "2.5"
prosopo-common = { path = "../common" }
prosopo-database = { path = "../database" }
prosopo-ipinfo = { path = "../ipinfo" }
prosopo-logger = { path = "../logger" }
prosopo-types = { path = "../types" }
prosopo-util = { path = "../util" }
prosopo-util-crypto = { path = "../util-crypto" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "preserve_order"] }
sha2 = "0.10"
hex = "0.4"
tokio = { version = "1", features = ["net", "rt", "sync", "time"] }

[dev-dependencies]
bson = { version = "3.1", features = ["serde"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time"] }

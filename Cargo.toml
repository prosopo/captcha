[workspace]
resolver = "2"
members = [
	"packages/captcha-severity",
	"packages/logger",
	"packages/puzzle-assets",
	"packages/web-bot-auth",
	"packages/api-route",
	"packages/audio-assets",
	"packages/icon-order-assets",
	"packages/util",
	"packages/util-crypto",
	"packages/dotenv",
	"packages/redis-client",
	"packages/locale",
]
exclude = [
	"packages/native-ja4",
	"packages/native-merkle",
	"packages/native-puzzle",
]

[workspace.package]
version = "6.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
debug = false
